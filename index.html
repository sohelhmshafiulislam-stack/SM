function render(child){ const d=child.val(); if(!d) return null; if(localStorage.getItem('deleted_me_'+child.key)) return null; const isMe=d.sender===currentUser; const div=document.createElement('div'); div.className=`flex ${isMe?'justify-end':'justify-start'} relative`; div.id='msg-'+child.key; let c=''; if(d.deleted){c=`<div class="italic opacity-60 text-[13px]">🚫 ${d.deletedBy} unsent a message</div>`;} else if(d.type==='image') c=`<img src="${d.data}" onclick="openLightbox('${d.data}','image')" class="rounded-xl max-w-[230px] cursor-zoom-in">`; else if(d.type==='video') c=`<video src="${d.data}" onclick="openLightbox('${d.data}','video')" class="rounded-xl max-w-[240px] max-h-[300px] bg-black"></video>`; else if(d.type==='file') c=`<a href="${d.data}" download="${d.fileName}" class="underline">📎 ${d.fileName}</a>`; else if(d.type==='audio') c=`<div class="flex items-center gap-2 min-w-[180px]"><button class="aplay w-8 h-8 bg-white/20 rounded-full flex items-center justify-center" data-key="${child.key}">▶️</button><audio id="aud-${child.key}" src="${d.data}"></audio><span class="text-xs">Voice</span></div>`; else c=`<div class="whitespace-pre-wrap break-words">${d.text||''}</div>`; let reactHtml=''; if(d.reacts){ const emojis=Object.values(d.reacts).join(''); reactHtml=`<div class="react-bar text-[12px]">${emojis}</div>`; } div.innerHTML=`<div class="${isMe?'msg-me':'msg-other'} px-4 py-2.5 max-w-[78%] text-white text-[14px] relative">${c}${reactHtml}<div class="text-[9px] opacity-60 mt-1 flex justify-between gap-3"><span>${d.time||''}</span><span>${d.deleted?'':isMe?(d.readByOther?'✓✓ Seen':'✓✓ Delivered'):d.sender}</span></div></div>`; const show=(e)=>{ selectedKey=child.key; selectedIsMe=isMe; const m=document.getElementById('contextMenu'); m.innerHTML=`<div class="flex justify-around p-2 border-b border-white/10 text-xl"><button onclick="addReact('❤️')">❤️</button><button onclick="addReact('😂')">😂</button><button onclick="addReact('😮')">😮</button><button onclick="addReact('😢')">😢</button><button onclick="addReact('😡')">😡</button><button onclick="addReact('👍')">👍</button></div>${d.deleted?`<button onclick="menuAction('me')" class="w-full text-left px-4 py-2.5 text-[13px]">🗑️ Delete for me</button>`:isMe?`<button onclick="menuAction('everyone')" class="w-full text-left px-4 py-2.5 text-[13px]">🚫 Unsend for Everyone</button><button onclick="menuAction('me')" class="w-full text-left px-4 py-2.5 text-[13px]">🗑️ Delete for me only</button>`:`<button onclick="menuAction('me')" class="w-full text-left px-4 py-2.5 text-[13px]">🗑️ Delete for me only</button>`}`; m.style.left=(e.pageX||30)+'px'; m.style.top=(e.pageY||80)+'px'; m.classList.remove('hidden'); }; div.oncontextmenu=e=>{e.preventDefault();show(e);}; let t; div.addEventListener('touchstart',e=>{t=setTimeout(()=>show(e.touches[0]),650);}); div.addEventListener('touchend',()=>clearTimeout(t)); div.querySelectorAll('.aplay').forEach(b=>{b.onclick=()=>{const aud=document.getElementById('aud-'+b.dataset.key);if(aud.paused){aud.play();b.textContent='⏸️';}else{aud.pause();b.textContent='▶️';} aud.onended=()=>b.textContent='▶️';};}); return div;}

async function startCall(v){ if(!currentUser) return; otherUser=currentUser==='Sohel'?'Mou':'Sohel'; document.getElementById('callScreen').classList.remove('hidden'); document.getElementById('callName').textContent=otherUser; document.getElementById('callStatusText').textContent='Calling...'; document.getElementById('callTimer').textContent='Calling...'; document.getElementById('callTone').play().catch(()=>{}); try{ localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:!!v}); }catch{alert('Camera/Mic allow'); return;} document.getElementById('localVideo').srcObject=localStream; document.getElementById('localVideo').classList.toggle('hidden',!v); const p1=createPC(); localStream.getTracks().forEach(t=>p1.addTrack(t,localStream)); const off=await p1.createOffer(); await p1.setLocalDescription(off); await fb.set(callRef,{offer:{type:off.type,sdp:off.sdp},caller:currentUser,callee:otherUser,type:v?'video':'voice',state:'calling'}); listenCandidates(otherUser);}
async function acceptCall(d){ document.getElementById('incomingBox').classList.add('hidden'); document.getElementById('callScreen').classList.remove('hidden'); document.getElementById('callName').textContent=d.caller; document.getElementById('ringTone').pause(); document.getElementById('ringTone').currentTime=0; document.getElementById('callTone').pause(); document.getElementById('callTone').currentTime=0; document.getElementById('callStatusText').textContent='Connected'; try{ localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:d.type==='video'}); }catch{return;} document.getElementById('localVideo').srcObject=localStream; document.getElementById('localVideo').classList.toggle('hidden',d.type!=='video'); const p2=createPC(); localStream.getTracks().forEach(t=>p2.addTrack(t,localStream)); await p2.setRemoteDescription(new RTCSessionDescription(d.offer)); const ans=await p2.createAnswer(); await p2.setLocalDescription(ans); await fb.set(fb.ref(db,'sm_calls/current/answer'),{type:ans.type,sdp:ans.sdp}); await fb.set(fb.ref(db,'sm_calls/current/state'),'connected'); listenCandidates(d.caller); startTimer();}
function endCall(){ fb.remove(fb.ref(db,'sm_calls/candidates/'+currentUser)); fb.remove(fb.ref(db,'sm_calls/candidates/'+otherUser)); if(pc)pc.close(); pc=null; if(localStream)localStream.getTracks().forEach(t=>t.stop()); clearInterval(timerInt); document.getElementById('ringTone').pause(); document.getElementById('callTone').pause(); document.getElementById('callScreen').classList.add('hidden'); document.getElementById('remoteVideo').srcObject=null; document.getElementById('remoteVideo').classList.add('hidden'); document.getElementById('remoteAudio').srcObject=null; fb.remove(callRef);}
fb.onValue(callRef,async s=>{ const d=s.val(); if(!d||!currentUser) return; if(d.state==='calling'&&d.callee===currentUser){document.getElementById('incomingText').textContent=d.caller+' calling...';document.getElementById('incomingBox').classList.remove('hidden');window._in=d;document.getElementById('ringTone').play().catch(()=>{});} if(d.answer&&d.caller===currentUser&&pc){try{await pc.setRemoteDescription(new RTCSessionDescription(d.answer));}catch{} document.getElementById('callName').textContent=d.callee; document.getElementById('callStatusText').textContent='Connected'; document.getElementById('callTone').pause(); document.getElementById('ringTone').pause(); startTimer();}});
document.getElementById('voiceBtn').onclick=()=>startCall(false); document.getElementById('videoBtn').onclick=()=>startCall(true); document.getElementById('acceptBtn').onclick=()=>{if(window._in)acceptCall(window._in);}; document.getElementById('declineBtn').onclick=()=>{document.getElementById('ringTone').pause();document.getElementById('callTone').pause();fb.remove(callRef);document.getElementById('incomingBox').classList.add('hidden');}; document.getElementById('endBtn').onclick=endCall;
document.getElementById('muteBtn').onclick=e=>{if(localStream)localStream.getAudioTracks().forEach(t=>t.enabled=!t.enabled);};
document.getElementById('speakerBtn').onclick=()=>{ speakerOn=!speakerOn; const btn=document.getElementById('speakerBtn').querySelector('div'); btn.style.background=speakerOn?'#2a7cff':'rgba(255,255,255,0.1)'; };
document.getElementById('whoami').onclick=()=>{localStorage.removeItem('sm_user');location.reload();};
document.addEventListener('click',()=>document.getElementById('contextMenu').classList.add('hidden'));
</script>
</body>
</html>
