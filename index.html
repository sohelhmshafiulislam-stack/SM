<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Select</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-[#0f0f1a] text-white p-4 max-w-[400px] mx-auto">
<h1 id="header" class="text-xl font-bold mb-2">Select User</h1>
<p id="status" class="text-xs text-white/50 mb-4">Select koro</p>

<div id="nameBox" class="flex gap-2 mb-4">
<button onclick="setUser('Sohel')" style="flex:1;padding:12px;background:white;color:black;border-radius:20px;font-weight:bold;">I am Sohel</button>
<button onclick="setUser('Mou')" style="flex:1;padding:12px;background:#ff4d8d;color:white;border-radius:20px;font-weight:bold;">I am Mou</button>
</div>

<div id="messages" style="height:300px;overflow-y:auto;background:#1a1a2e;padding:10px;border-radius:10px;margin-bottom:10px;"></div>

<div class="flex gap-2">
<input id="msgInput" placeholder="Aa" style="flex:1;padding:12px;background:#2a2a42;border-radius:20px;color:white;outline:none;">
<button onclick="sendMessage()" style="padding:12px 20px;background:#ff4d8d;border-radius:20px;">Send</button>
</div>

<p id="debug" class="text-[10px] text-white/30 mt-4"></p>

<script>
var firebaseConfig={apiKey:"AIzaSyD-2OqkcSev3XzcAt4-p2kGLkGYYqL8hzE",authDomain:"sm-chat-da9f7.firebaseapp.com",projectId:"sm-chat-da9f7",databaseURL:"https://sm-chat-da9f7-default-rtdb.asia-southeast1.firebasedatabase.app"};
firebase.initializeApp(firebaseConfig);
var db=firebase.database();
var messagesRef=db.ref("smMessenger/messages/SM_ROOM");
var currentUser='';

function setUser(n){
  currentUser=n;
  localStorage.setItem('sm_user',n);
  document.getElementById('header').innerText=n+' selected! Other: '+(n==='Sohel'?'Mou':'Sohel');
  document.getElementById('status').innerText='Active now - '+n;
  document.getElementById('status').style.color='lightgreen';
  document.getElementById('nameBox').style.display='none';
  document.getElementById('debug').innerText='Selected: '+n+' at '+new Date().toLocaleTimeString();
  alert(n+' selected! Ekhon msg pathao!');
  loadMessages();
}

function loadMessages(){
  messagesRef.on('value',function(snap){
    var el=document.getElementById('messages');
    el.innerHTML='';
    snap.forEach(function(child){
      var d=child.val();
      var isMe=d.sender===currentUser;
      var div=document.createElement('div');
      div.style.cssText='margin:6px 0;padding:8px 12px;border-radius:12px;max-width:80%;'+(isMe?'background:#ff4d8d;margin-left:auto':'background:#2a2a4a');
      div.innerText=d.sender+': '+(d.text||d.type);
      el.appendChild(div);
    });
    el.scrollTop=el.scrollHeight;
  });
}

function sendMessage(){
  var text=document.getElementById('msgInput').value.trim();
  if(!text){alert('Lekho');return;}
  if(!currentUser){alert('Age I am Sohel / Mou select koro!');return;}
  messagesRef.push({sender:currentUser,text:text,time:new Date().toLocaleTimeString(),createdAt:firebase.database.ServerValue.TIMESTAMP});
  document.getElementById('msgInput').value='';
}

var cu=localStorage.getItem('sm_user');
if(cu){ setTimeout(function(){ setUser(cu); },800); }

// Debug
document.getElementById('debug').innerText='JS Loaded OK - '+new Date().toLocaleTimeString();
</script>
</body>
</html>
