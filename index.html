<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM - Msg React + Screen Share</title><script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:system-ui} .me{background:linear-gradient(135deg,#ff4d8d,#a855f7);color:#fff;border-radius:18px 18px 2px 18px} .other{background:#27273f;color:#fff;border-radius:18px 18px 18px 2px} .react-bubble{position:absolute;bottom:-12px;right:8px;background:#1e1e32;border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:2px 6px;font-size:11px;display:flex;gap:2px}</style></head>
<body class="bg-[#0a0a14] h-[100dvh] flex flex-col max-w-[480px] mx-auto relative">
<header class="bg-[#1e1e32] p-3 flex items-center justify-between border-b border-white/10">
<div class="flex items-center gap-2"><div class="w-10 h-10 rounded-full bg-gradient-to-br from-pink-500 to-violet-600 flex items-center justify-center font-bold text-white">SM</div><div><h1 class="text-white text-[14px] font-bold">Sohel ❤️ Mou</h1><p class="text-[11px] text-green-400">● Msg React + Zoom + Screen Share</p></div></div>
<div class="flex gap-2"><button id="voiceBtn" class="w-9 h-9 bg-white/10 rounded-full">📞</button><button id="videoBtn" class="w-9 h-9 bg-white/10 rounded-full">📹</button><button id="whoami" class="text-[10px] bg-white/10 text-white/60 px-2 py-1 rounded-full"></button></div></header>
<div id="nameBox" class="p-2 bg-[#1e1e32] flex gap-2"><button onclick="setUser('Sohel')" class="flex-1 py-2.5 rounded-full bg-white text-black font-bold">I am Sohel</button><button onclick="setUser('Mou')" class="flex-1 py-2.5 rounded-full bg-pink-600 text-white font-bold">I am Mou</button></div>
<div id="messages" class="flex-1 overflow-y-auto p-3 space-y-4 bg-[#121223]"></div>

<!-- REACT EMOJI PICKER FOR MSG -->
<div id="msgReactPicker" class="hidden fixed z-[60] bg-[#2a2a42] border border-white/20 rounded-full px-3 py-2 flex gap-3 shadow-2xl"><button onclick="sendReact('❤️')" class="text-xl">❤️</button><button onclick="sendReact('😍')" class="text-xl">😍</button><button onclick="sendReact('😂')" class="text-xl">😂</button><button onclick="sendReact('🥺')" class="text-xl">🥺</button><button onclick="sendReact('😮')" class="text-xl">😮</button><button onclick="sendReact('😢')" class="text-xl">😢</button></div>

<div id="imgModal" class="hidden fixed inset-0 bg-black z-[100] flex flex-col"><div class="flex-1 flex items-center justify-center overflow-hidden relative"><img id="modalImg" class="max-w-full max-h-full"><button onclick="closeModal()" class="absolute top-4 right-4 bg-white/20 w-10 h-10 rounded-full text-white">✕</button></div><div class="p-3 bg-[#1e1e32] flex justify-center gap-4"><button onclick="reactImg('❤️')" class="text-2xl">❤️</button><button onclick="reactImg('😍')" class="text-2xl">😍</button><button onclick="reactImg('😂')" class="text-2xl">😂</button><button onclick="reactImg('🥺')" class="text-2xl">🥺</button><button onclick="reactImg('😮')" class="text-2xl">😮</button></div><div id="reacts" class="p-2 flex gap-2 justify-center flex-wrap"></div></div>

<div id="callScreen" class="hidden absolute inset-0 bg-black z-50 flex flex-col"><div class="flex-1 relative"><video id="remoteVideo" autoplay playsinline class="absolute inset-0 w-full h-full object-cover"></video><video id="localVideo" autoplay muted playsinline class="absolute bottom-28 right-4 w-28 h-40 bg-[#222] rounded-xl border border-white/20"></video><div class="absolute top-20 left-0 right-0 text-center"><p id="callName" class="text-white font-bold">Calling...</p><p id="callTimer" class="text-white/70 text-sm">00:00</p><p id="shareStatus" class="text-yellow-300 text-xs mt-1 hidden">● Screen Sharing</p></div></div><div class="p-6 bg-[#1e1e32] flex justify-center gap-4"><button id="screenBtn" class="w-14 h-14 bg-white/20 rounded-full text-xl">🖥️</button><button id="muteBtn" class="w-14 h-14 bg-white/20 rounded-full">🎙️</button><button id="endBtn" class="w-16 h-16 bg-red-600 rounded-full text-2xl">📞</button></div></div>
<div id="incomingBox" class="hidden absolute top-16 left-4 right-4 bg-[#1e1e32] border border-pink-500/50 p-4 rounded-2xl z-40 flex justify-between"><div><p id="incomingText" class="text-white text-sm font-bold">Incoming...</p></div><div class="flex gap-3"><button id="declineBtn" class="w-12 h-12 bg-red-600 rounded-full">❌</button><button id="acceptBtn" class="w-12 h-12 bg-green-600 rounded-full">✅</button></div></div>
<div id="previewBox" class="hidden p-2 bg-black/80 flex justify-between items-center"><div class="flex gap-2 items-center"><img id="previewImg" class="h-14 w-14 rounded object-cover"><p id="previewName" class="text-white text-xs"></p></div><button onclick="cancelImg()" class="bg-white/20 w-8 h-8 rounded-full text-white">✕</button></div>
<div id="recBox" class="hidden p-3 bg-red-900/80 flex justify-between"><span class="text-white text-sm">● Rec <span id="recTime">0s</span></span><button id="stopRec" class="bg-white text-red-600 px-4 py-1.5 rounded-full text-xs font-bold">Stop</button></div>
<div id="attachBox" class="hidden p-3 bg-[#1e1e32] grid grid-cols-4 gap-3"><label class="flex flex-col items-center gap-1 bg-white/10 p-3 rounded-xl cursor-pointer"><span>🖼️</span><span class="text-[10px] text-white">Photo</span><input type="file" id="imgInput" accept="image/*" hidden></label><label class="flex flex-col items-center gap-1 bg-white/10 p-3 rounded-xl cursor-pointer"><span>🎥</span><span class="text-[10px] text-white">Video</span><input type="file" id="videoInput" accept="video/*" hidden></label><label class="flex flex-col items-center gap-1 bg-white/10 p-3 rounded-xl cursor-pointer"><span>📄</span><span class="text-[10px] text-white">File</span><input type="file" id="fileInput" hidden></label><button id="closeAttach" class="bg-white/10 p-3 rounded-xl text-white">✕</button></div>
<div class="p-2.5 bg-[#1e1e32] flex items-end gap-2 border-t border-white/10">
<button id="plusBtn" class="w-11 h-11 bg-white/10 rounded-full text-white text-xl">+</button>
<button id="micBtn" class="w-11 h-11 bg-white/10 rounded-full">🎤</button>
<textarea id="msgInput" rows="1" placeholder="Message..." class="flex-1 bg-[#2a2a42] rounded-[22px] px-4 py-3 text-white text-[14px] outline-none resize-none"></textarea>
<button id="sendBtn" class="w-11 h-11 bg-gradient-to-br from-pink-500 to-violet-600 rounded-full text-white font-bold">↑</button></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, onValue, set, remove, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyD-2OqkcSev3XzcAt4-p2kGLkGYYqL8hzE", authDomain: "sm-chat-da9f7.firebaseapp.com", databaseURL: "https://sm-chat-da9f7-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "sm-chat-da9f7", storageBucket: "sm-chat-da9f7.firebasestorage.app", messagingSenderId: "854162073261", appId: "1:854162073261:web:95b663faf367b19d048824" };
const app=initializeApp(firebaseConfig); const db=getDatabase(app); const messagesRef=ref(db,"sm_all_messages"); const callRef=ref(db,"sm_calls/current");
let currentUser='', pc, localStream, screenStream=null, isScreenSharing=false, timerInt, mediaRec, audioChunks=[], recTimer, pendingData=null, pendingType=null, currentImgKey=null, selectedMsgKey=null, scale=1, lastDist=0;
function updateWho(){ const w=document.getElementById('whoami'); if(currentUser){ w.textContent=currentUser; document.getElementById('nameBox').style.display='none';} else{ w.textContent='Select'; document.getElementById('nameBox').style.display='flex';}}
currentUser=localStorage.getItem('sm_user')||''; updateWho(); window.setUser=(n)=>{ currentUser=n; localStorage.setItem('sm_user',n); updateWho(); };
const messagesEl=document.getElementById('messages'); const msgInput=document.getElementById('msgInput'); const reactPicker=document.getElementById('msgReactPicker');
window.openImg=(src,key)=>{ currentImgKey=key; document.getElementById('modalImg').src=src; document.getElementById('imgModal').classList.remove('hidden'); scale=1; document.getElementById('modalImg').style.transform='scale(1)'; };
window.closeModal=()=>document.getElementById('imgModal').classList.add('hidden');
window.reactImg=async(e)=>{ if(!currentUser||!currentImgKey) return; await push(ref(db,'sm_all_messages/'+currentImgKey+'/reacts'),{emoji:e,user:currentUser,ts:Date.now()}); };
function showPicker(key, x, y){ selectedMsgKey=key; reactPicker.style.left=x+'px'; reactPicker.style.top=y+'px'; reactPicker.classList.remove('hidden'); }
window.sendReact=async(emoji)=>{ if(!selectedMsgKey||!currentUser) return; await push(ref(db,'sm_all_messages/'+selectedMsgKey+'/reacts'),{emoji,user:currentUser,ts:Date.now()}); reactPicker.classList.add('hidden'); selectedMsgKey=null; };
document.addEventListener('click', e=>{ if(!reactPicker.contains(e.target)) reactPicker.classList.add('hidden'); });

onChildAdded(messagesRef, snap=>{
  const d=snap.val(); const key=snap.key; if(!d) return;
  const isMe=d.sender===currentUser;
  const div=document.createElement('div'); div.className=`flex ${isMe?'justify-end':'justify-start'}`;
  let inner=''; const time=`${d.sender} • ${d.time}`;
  if(d.type==='image'){ inner=`<div data-key="${key}" class="msg-bubble relative ${isMe?'me':'other'} p-1.5 max-w-[75%]"><img onclick="openImg('${d.text}','${key}')" src="${d.text}" class="rounded-xl max-w-[220px] cursor-zoom-in"><div id="r-${key}" class="flex gap-1 mt-1 flex-wrap"></div><div class="text-[9px] opacity-60 px-1 mt-1">${time}</div></div>`; }
  else if(d.type==='video'){ inner=`<div data-key="${key}" class="msg-bubble relative ${isMe?'me':'other'} p-1.5 max-w-[75%]"><video controls src="${d.text}" class="rounded-xl max-w-[240px]"></video><div id="r-${key}" class="flex gap-1 mt-1"></div><div class="text-[9px] opacity-60 px-1 mt-1">${time}</div></div>`; }
  else if(d.type==='file'){ inner=`<div data-key="${key}" class="msg-bubble relative ${isMe?'me':'other'} px-3 py-2.5 max-w-[75%]"><p class="text-sm">📄 ${d.fileName}</p><a href="${d.text}" download class="text-xs underline">Download</a><div id="r-${key}" class="flex gap-1"></div><div class="text-[9px] opacity-60">${time}</div></div>`; }
  else if(d.type==='audio'){ inner=`<div data-key="${key}" class="msg-bubble relative ${isMe?'me':'other'} px-3 py-2 max-w-[75%]"><audio controls src="${d.text}" class="max-w-[200px]"></audio><div id="r-${key}" class="flex gap-1"></div><div class="text-[9px] opacity-60 mt-1">${time}</div></div>`; }
  else { inner=`<div data-key="${key}" class="msg-bubble relative ${isMe?'me':'other'} px-4 py-2.5 max-w-[78%] text-[14px]"><div class="whitespace-pre-wrap break-words">${d.text}</div><div id="r-${key}" class="flex gap-1 mt-1"></div><div class="text-[9px] opacity-60 mt-1 text-right">${time}</div></div>`; }
  div.innerHTML=inner; messagesEl.appendChild(div); messagesEl.scrollTop=messagesEl.scrollHeight;

  const bubble=div.querySelector('.msg-bubble');
  bubble.addEventListener('click', (e)=>{ const rect=bubble.getBoundingClientRect(); showPicker(key, rect.left, rect.top-50); });
  bubble.addEventListener('dblclick', (e)=>{ const rect=bubble.getBoundingClientRect(); showPicker(key, rect.left, rect.top-50); });
  bubble.addEventListener('contextmenu', (e)=>{ e.preventDefault(); const rect=bubble.getBoundingClientRect(); showPicker(key, rect.left, rect.top-50); });

  onChildAdded(ref(db,'sm_all_messages/'+key+'/reacts'), s=>{
    const rd=s.val(); const c=document.getElementById('r-'+key); if(c){ const b=document.createElement('span'); b.className='text-[11px] bg-black/40 border border-white/10 px-1.5 py-0.5 rounded-full'; b.textContent=rd.emoji; c.appendChild(b); }
  });
});

async function send(){ if(!currentUser){ alert('Select'); return; } let txt=msgInput.value.trim(); if(!txt && !pendingData) return; let payload={sender:currentUser, time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}), ts:Date.now()}; if(pendingData){ payload.text=pendingData; payload.type=pendingType; payload.fileName=document.getElementById('previewName').textContent; } else { payload.text=txt; payload.type='text'; } await push(messagesRef,payload); msgInput.value=''; pendingData=null; document.getElementById('previewBox').classList.add('hidden'); }
document.getElementById('sendBtn').onclick=send; msgInput.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); }});
function handleFile(input, type){ input.onchange=(e)=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ if(type==='image'){ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); let w=img.width,h=img.height; const max=700; if(w>h){ if(w>max){h*=max/w; w=max;}} else{if(h>max){w*=max/h; h=max;}} c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); pendingData=c.toDataURL('image/jpeg',0.65); }; img.src=r.result; } else { pendingData=r.result; } pendingType=type; document.getElementById('previewImg').src=type==='image'?r.result:''; document.getElementById('previewName').textContent=f.name; document.getElementById('previewBox').classList.remove('hidden'); document.getElementById('attachBox').classList.add('hidden'); }; r.readAsDataURL(f); }; }
handleFile(document.getElementById('imgInput'),'image'); handleFile(document.getElementById('videoInput'),'video'); handleFile(document.getElementById('fileInput'),'file');
window.cancelImg=()=>{ pendingData=null; document.getElementById('previewBox').classList.add('hidden'); };
document.getElementById('plusBtn').onclick=()=>{ document.getElementById('attachBox').classList.toggle('hidden'); }; document.getElementById('closeAttach').onclick=()=>document.getElementById('attachBox').classList.add('hidden');
document.getElementById('micBtn').onclick=async()=>{ try{ const stream=await navigator.mediaDevices.getUserMedia({audio:true}); audioChunks=[]; mediaRec=new MediaRecorder(stream); mediaRec.ondataavailable=e=>audioChunks.push(e.data); mediaRec.onstop=async()=>{ const blob=new Blob(audioChunks,{type:'audio/webm'}); const reader=new FileReader(); reader.onloadend=async()=>{ await push(messagesRef,{sender:currentUser,text:reader.result,type:'audio',time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),ts:Date.now()}); stream.getTracks().forEach(t=>t.stop()); }; reader.readAsDataURL(blob); document.getElementById('recBox').classList.add('hidden'); clearInterval(recTimer); }; mediaRec.start(); document.getElementById('recBox').classList.remove('hidden'); let s=0; recTimer=setInterval(()=>{s++; document.getElementById('recTime').textContent=s+'s';},1000); }catch(e){} }; document.getElementById('stopRec').onclick=()=>{ if(mediaRec) mediaRec.stop(); };
const modalImg=document.getElementById('modalImg'); modalImg.addEventListener('touchstart',e=>{ if(e.touches.length==2){ lastDist=Math.hypot(e.touches[0].pageX-e.touches[1].pageX, e.touches[0].pageY-e.touches[1].pageY); }}); modalImg.addEventListener('touchmove',e=>{ if(e.touches.length==2){ e.preventDefault(); const dist=Math.hypot(e.touches[0].pageX-e.touches[1].pageX, e.touches[0].pageY-e.touches[1].pageY); scale=Math.min(Math.max(1,scale*dist/lastDist),4); modalImg.style.transform=`scale(${scale})`; lastDist=dist; }},{passive:false});
const iceServers={iceServers:[{urls:'stun:stun.l.google.com:19302'}]}; 
function createPC(){ pc=new RTCPeerConnection(iceServers); pc.onicecandidate=e=>{ if(e.candidate) push(ref(db,'sm_calls/candidates/'+currentUser), e.candidate.toJSON()); }; pc.ontrack=e=>{ document.getElementById('remoteVideo').srcObject=e.streams[0]; }; return pc; }
async function startCall(type){ if(!currentUser) return; const other=currentUser==='Sohel'?'Mou':'Sohel'; document.getElementById('callScreen').classList.remove('hidden'); document.getElementById('callName').textContent=other+' calling...'; try{ localStream=await navigator.mediaDevices.getUserMedia({video:type==='video', audio:true}); document.getElementById('localVideo').srcObject=localStream; const pc1=createPC(); localStream.getTracks().forEach(t=>pc1.addTrack(t,localStream)); const offer=await pc1.createOffer(); await pc1.setLocalDescription(offer); await set(callRef,{offer:{type:offer.type,sdp:offer.sdp},caller:currentUser,callee:other,type,state:'calling'}); }catch(e){} }
async function acceptCall(data){ document.getElementById('incomingBox').classList.add('hidden'); document.getElementById('callScreen').classList.remove('hidden'); try{ localStream=await navigator.mediaDevices.getUserMedia({video:data.type==='video', audio:true}); document.getElementById('localVideo').srcObject=localStream; const pc2=createPC(); localStream.getTracks().forEach(t=>pc2.addTrack(t,localStream)); await pc2.setRemoteDescription(new RTCSessionDescription(data.offer)); const ans=await pc2.createAnswer(); await pc2.setLocalDescription(ans); await set(ref(db,'sm_calls/current/answer'),{type:ans.type,sdp:ans.sdp}); let s=0; timerInt=setInterval(()=>{s++; document.getElementById('callTimer').textContent=Math.floor(s/60).toString().padStart(2,'0')+':'+(s%60).toString().padStart(2,'0');},1000); }catch(e){} }
function endCall(){ if(pc) pc.close(); pc=null; if(localStream) localStream.getTracks().forEach(t=>t.stop()); if(screenStream) screenStream.getTracks().forEach(t=>t.stop()); screenStream=null; isScreenSharing=false; clearInterval(timerInt); document.getElementById('callScreen').classList.add('hidden'); document.getElementById('shareStatus').classList.add('hidden'); remove(callRef); }
async function toggleScreenShare(){ if(!pc) return; if(!isScreenSharing){ try{ screenStream=await navigator.mediaDevices.getDisplayMedia({video:true}); const st=screenStream.getVideoTracks()[0]; const sender=pc.getSenders().find(s=>s.track&&s.track.kind==='video'); if(sender) sender.replaceTrack(st); document.getElementById('localVideo').srcObject=screenStream; document.getElementById('shareStatus').classList.remove('hidden'); document.getElementById('screenBtn').style.background='#a855f7'; isScreenSharing=true; st.onended=()=>toggleScreenShare(); }catch(e){} } else { try{ const cam=await navigator.mediaDevices.getUserMedia({video:true, audio:true}); const ct=cam.getVideoTracks()[0]; const sender=pc.getSenders().find(s=>s.track&&s.track.kind==='video'); if(sender) sender.replaceTrack(ct); document.getElementById('localVideo').srcObject=cam; localStream=cam; if(screenStream) screenStream.getTracks().forEach(t=>t.stop()); document.getElementById('shareStatus').classList.add('hidden'); document.getElementById('screenBtn').style.background=''; isScreenSharing=false; }catch(e){} } }
onValue(callRef, async snap=>{ const data=snap.val(); if(!data||!currentUser) return; if(data.state==='calling'&&data.callee===currentUser){ document.getElementById('incomingText').textContent=data.caller+' calling...'; document.getElementById('incomingBox').classList.remove('hidden'); window._incoming=data; } if(data.answer&&data.caller===currentUser&&pc){ try{ await pc.setRemoteDescription(new RTCSessionDescription(data.answer)); }catch(e){} } });
document.getElementById('voiceBtn').onclick=()=>startCall('voice'); document.getElementById('videoBtn').onclick=()=>startCall('video'); document.getElementById('screenBtn').onclick=toggleScreenShare; document.getElementById('acceptBtn').onclick=()=>acceptCall(window._incoming); document.getElementById('declineBtn').onclick=()=>{ remove(callRef); document.getElementById('incomingBox').classList.add('hidden'); }; document.getElementById('endBtn').onclick=endCall; document.getElementById('whoami').onclick=()=>{ localStorage.removeItem('sm_user'); currentUser=''; updateWho(); };
</script></body></html>
