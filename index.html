<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM Private Chat V2</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:'Poppins',sans-serif}
.msg-sohel{background:linear-gradient(135deg,#ff4d8d,#ff7eb3);color:#fff;border-radius:18px 18px 2px 18px}
.msg-mou{background:#2a2a4a;color:#fff;border-radius:18px 18px 18px 2px}
</style>
</head>
<body class="bg-[#0f0f1a] h-[100dvh] flex flex-col max-w-[480px] mx-auto">
<header class="bg-[#1a1a2e] p-4 flex items-center justify-between border-b border-white/10">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-gradient-to-br from-pink-500 to-violet-600 flex items-center justify-center font-bold text-white">SM</div>
<div><h1 class="text-white font-semibold">Sohel ❤️ Mou</h1><p class="text-[11px] text-green-400">● Offline msg + Photo ON</p></div>
</div>
<button id="whoami" class="text-[11px] text-white/60 bg-white/10 px-3 py-1 rounded-full"></button>
</header>
<div id="nameBox" class="p-3 bg-[#1a1a2e] flex gap-2">
<button onclick="setUser('Sohel')" class="flex-1 py-2.5 rounded-full bg-white text-black font-semibold">I am Sohel</button>
<button onclick="setUser('Mou')" class="flex-1 py-2.5 rounded-full bg-pink-600 text-white font-semibold">I am Mou</button>
</div>
<div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3 bg-[#12121f]"></div>
<div id="previewBox" class="hidden p-3 bg-black/60 flex items-center justify-between">
<div class="flex items-center gap-2"><img id="previewImg" class="h-14 w-14 object-cover rounded-lg"><span class="text-white text-xs">Photo ready</span></div>
<button onclick="cancelImg()" class="text-white bg-white/20 px-3 py-1 rounded-full text-xs">X</button>
</div>
<div class="p-3 bg-[#1a1a2e] flex items-end gap-2">
<label class="w-11 h-11 bg-white/10 rounded-full flex items-center justify-center cursor-pointer text-xl">📷<input type="file" id="imgInput" accept="image/*" hidden></label>
<textarea id="msgInput" rows="1" placeholder="Moner kotha likho..." class="flex-1 bg-white/10 rounded-[20px] px-4 py-3 text-white text-[14px] outline-none resize-none"></textarea>
<button id="sendBtn" class="w-11 h-11 bg-gradient-to-br from-pink-500 to-violet-600 rounded-full text-white text-[20px]">↑</button>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, query, orderByChild } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyD-2OqkcSev3XzcAt4-p2kGLkGYYqL8hzE",
  authDomain: "sm-chat-da9f7.firebaseapp.com",
  projectId: "sm-chat-da9f7",
  storageBucket: "sm-chat-da9f7.firebasestorage.app",
  messagingSenderId: "854162073261",
  appId: "1:854162073261:web:95b663faf367b19d048824",
  databaseURL: "https://sm-chat-da9f7-default-rtdb.asia-southeast1.firebasedatabase.app"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const messagesRef = ref(db, "sm_v2_messages");
let currentUser = localStorage.getItem('sm_user') || '';
const whoami = document.getElementById('whoami');
function updateWho(){ if(currentUser){ whoami.textContent = currentUser; document.getElementById('nameBox').style.display='none'; } else{ whoami.textContent = 'Select name'; document.getElementById('nameBox').style.display='flex'; } }
updateWho();
window.setUser = (name)=>{ currentUser = name; localStorage.setItem('sm_user', name); updateWho(); };
const messagesEl = document.getElementById('messages');
const msgInput = document.getElementById('msgInput');
let pendingImage = null;
onChildAdded(query(messagesRef, orderByChild('ts')), (snap)=>{
  const d = snap.val(); if(!d) return;
  const isMe = d.sender === currentUser;
  const div = document.createElement('div'); div.className = `flex ${isMe?'justify-end':'justify-start'}`;
  let inner=''; if(d.type==='image'){ inner = `<div class="${isMe?'msg-sohel':'msg-mou'} p-1.5 max-w-[75%]"><img src="${d.text}" class="rounded-xl max-w-[220px]"><div class="text-[10px] opacity-60 px-2 pt-1">${d.sender} • ${d.time}</div></div>`; }else{ inner = `<div class="${isMe?'msg-sohel':'msg-mou'} px-4 py-2.5 max-w-[78%] text-[14px]"><div class="whitespace-pre-wrap break-words">${d.text}</div><div class="text-[9px] opacity-60 mt-1 text-right">${d.sender} • ${d.time}</div></div>`; }
  div.innerHTML = inner; messagesEl.appendChild(div); messagesEl.scrollTop = messagesEl.scrollHeight;
});
async function send(){ if(!currentUser){ alert('Age Sohel / Mou select koro!'); return; } const txt = msgInput.value.trim(); if(!txt && !pendingImage) return; const payload = { sender: currentUser, text: pendingImage ? pendingImage : txt, type: pendingImage ? 'image' : 'text', time: new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}), ts: Date.now() }; msgInput.value=''; pendingImage=null; document.getElementById('previewBox').classList.add('hidden'); await push(messagesRef, payload); }
document.getElementById('sendBtn').onclick = send;
msgInput.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
document.getElementById('imgInput').onchange = (e)=>{ const file = e.target.files[0]; if(!file) return; if(file.size > 900*1024){ alert('900KB er kom photo dao!'); return; } const r = new FileReader(); r.onload = ()=>{ pendingImage = r.result; document.getElementById('previewImg').src = pendingImage; document.getElementById('previewBox').classList.remove('hidden'); }; r.readAsDataURL(file); };
window.cancelImg = ()=>{ pendingImage=null; document.getElementById('previewBox').classList.add('hidden'); };
whoami.onclick = ()=>{ localStorage.removeItem('sm_user'); currentUser=''; updateWho(); };
</script>
</body>
</html>
