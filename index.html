<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sohel ❤️ Mou Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:sans-serif}
#messages{position:relative}
#messages::before{content:"";position:absolute;inset:0;background:url('bg.jpg') center/cover no-repeat;opacity:0.22;filter:blur(2px);z-index:-1}
.msg-me{background:linear-gradient(135deg,#ff4d8d,#ff7eb3);border-radius:18px 18px 2px 18px}
.msg-other{background:#2a2a4a;border-radius:18px 18px 18px 2px}
.voice-box{display:flex;align-items:center;gap:10px;min-width:200px}
.wave{display:flex;gap:2px;align-items:center;height:24px}
.wave i{width:3px;height:10px;background:#fff;border-radius:2px;display:block}
.messenger-bar{background:#1a1a2e;border-top:1px solid rgba(255,255,255,0.08)}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, onValue, set, remove, update, onDisconnect, query, orderByChild, onChildRemoved, onChildChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyD-2OqkcSev3XzcAt4-p2kGLkGYYqL8hzE",authDomain:"sm-chat-da9f7.firebaseapp.com",projectId:"sm-chat-da9f7",databaseURL:"https://sm-chat-da9f7-default-rtdb.asia-southeast1.firebasedatabase.app"};
const app=initializeApp(firebaseConfig);const db=getDatabase(app);window.fb={ref,push,onChildAdded,onValue,set,remove,update,onDisconnect,query,orderByChild,onChildRemoved,onChildChanged};window.db=db;
</script>
</head>
<body class="bg-[#0f0f1a] h-[100dvh] flex flex-col max-w-[480px] mx-auto relative">
<audio id="ringTone" loop src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a73467.mp3"></audio>
<audio id="callTone" loop src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3"></audio>

<div id="lockScreen" class="fixed inset-0 bg-[#0a0a14] z-[999] flex flex-col items-center justify-center p-6">
<div class="w-20 h-20 rounded-full bg-gradient-to-br from-pink-500 to-violet-600 flex items-center justify-center text-3xl">🔒</div>
<h2 class="font-bold text-xl mt-4 text-white">Sohel ❤️ Mou</h2>
<input id="passInput" type="password" placeholder="76435668" class="mt-6 w-full max-w-[300px] bg-[#1e1e32] border border-white/20 rounded-full px-6 py-3 text-center outline-none text-white">
<button onclick="if(document.getElementById('passInput').value==='76435668'){document.getElementById('lockScreen').style.display='none';localStorage.setItem('sm_unlocked','yes')}" class="mt-3 w-full max-w-[300px] bg-gradient-to-br from-pink-500 to-violet-600 font-bold py-3 rounded-full text-white">Unlock</button>
</div>

<header class="bg-[#1a1a2e] p-3 flex items-center justify-between border-b border-white/10">
<div class="flex items-center gap-2"><div class="w-9 h-9 rounded-full bg-gradient-to-br from-pink-500 to-violet-600 flex items-center justify-center font-bold text-white text-sm">SM</div><div><h1 id="headerName" class="text-white text-sm font-semibold">Select User</h1><p id="statusText" class="text-[11px] text-white/50">Tap to select</p></div></div>
<div class="flex gap-2"><button id="voiceBtn" class="w-9 h-9 bg-white/10 rounded-full">📞</button><button id="videoBtn" class="w-9 h-9 bg-white/10 rounded-full">📹</button><button id="whoami" class="text-[10px] bg-white/10 px-2 py-1 rounded-full text-white/60"></button></div>
</header>

<div id="nameBox" class="p-2 bg-[#1a1a2e] flex gap-2"><button onclick="setUser('Sohel')" class="flex-1 py-2.5 rounded-full bg-white text-black text-sm font-bold">I am Sohel</button><button onclick="setUser('Mou')" class="flex-1 py-2.5 rounded-full bg-pink-600 text-white text-sm font-bold">I am Mou</button></div>
<div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3 bg-[#12121f]/60"></div>

<div id="callScreen" class="hidden absolute inset-0 bg-black z-50 flex flex-col"><div class="flex-1 relative"><video id="remoteVideo" autoplay playsinline class="absolute inset-0 w-full h-full object-cover"></video><video id="localVideo" autoplay muted playsinline class="absolute bottom-24 right-4 w-28 h-40 bg-[#222] rounded-xl"></video><div class="absolute top-20 left-0 right-0 text-center"><p id="callName" class="text-white font-semibold">Calling...</p><p id="callTimer" class="text-white/60 text-sm">00:00</p></div></div><div class="p-6 bg-[#1a1a2e] flex justify-center gap-4"><button id="muteBtn" class="w-14 h-14 bg-white/10 rounded-full">🎤</button><button id="endBtn" class="w-14 h-14 bg-red-600 rounded-full">📞</button></div></div>
<div id="incomingBox" class="hidden absolute top-16 left-4 right-4 bg-[#1e1e32] border border-pink-500/50 p-4 rounded-2xl z-40 flex justify-between items-center"><p id="incomingText" class="text-white text-sm font-bold">Calling...</p><div class="flex gap-3"><button id="declineBtn" class="w-12 h-12 bg-red-600 rounded-full">❌</button><button id="acceptBtn" class="w-12 h-12 bg-green-500 rounded-full">✅</button></div></div>
<div id="previewBox" class="hidden p-2 bg-black/80 flex justify-between items-center text-white text-xs"><span id="previewText"></span><button onclick="cancelPreview()" class="px-2 py-1 bg-red-600 rounded-full">X</button></div>

<!-- MESSENGER STYLE BOTTOM -->
<div class="messenger-bar p-2 flex items-end gap-2">
<button onclick="document.getElementById('imgInput').click()" class="w-11 h-11 bg-[#2a2a42] rounded-full flex items-center justify-center">📷</button>
<input type="file" id="imgInput" accept="image/*,video/*" hidden>
<button onclick="document.getElementById('fileInput').click()" class="w-11 h-11 bg-[#2a2a42] rounded-full flex items-center justify-center">📎</button>
<input type="file" id="fileInput" accept=".pdf,.doc,.docx,.zip,.mp4" hidden>
<div class="flex-1 bg-[#2a2a42] rounded-full px-4 py-2.5 flex items-center">
<textarea id="msgInput" rows="1" placeholder="Aa" class="flex-1 bg-transparent text-white text-[15px] outline-none resize-none"></textarea>
</div>
<button id="micBtn" class="w-11 h-11 bg-[#2a2a42] rounded-full flex items-center justify-center">🎙️</button>
<button id="sendBtn" class="w-11 h-11 bg-gradient-to-br from-pink-500 to-violet-600 rounded-full text-white">➤</button>
</div>

<div id="contextMenu" class="hidden fixed z-[700] bg-[#2a2a42] border border-white/20 rounded-2xl shadow-2xl min-w-[230px] overflow-hidden"></div>

<script type="module">
const messagesRef=fb.ref(db,"sm_v2_messages");const callRef=fb.ref(db,"sm_calls/current");const presenceRef=fb.ref(db,"sm_presence");
let currentUser='',otherUser='',pc,localStream,timerInt;let presenceData={};let pendingImage=null,pendingVideo=null,pendingFile=null,pendingAudio=null;let selectedKey=null,selectedIsMe=false;

function timeAgo(ts){if(!ts) return 'Offline';const d=Date.now()-ts;const m=Math.floor(d/60000);if(m<1) return 'Active now';if(m<60) return `Active ${m}m ago`;const h=Math.floor(m/60);if(h<24) return `Active ${h}h ago`;return `Active ${Math.floor(h/24)}d ago`;}

function setUser(n){currentUser=n;otherUser=n==='Sohel'?'Mou':'Sohel';localStorage.setItem('sm_user',n);document.getElementById('whoami').textContent=n;document.getElementById('headerName').textContent=otherUser;document.getElementById('nameBox').style.display='none';fb.set(fb.ref(db,'sm_presence/'+n),{online:true,last:Date.now()});fb.onDisconnect(fb.ref(db,'sm_presence/'+n)).set({online:false,last:Date.now()});}
let cu=localStorage.getItem('sm_user')||'';if(cu)setUser(cu);window.setUser=setUser;
if(localStorage.getItem('sm_unlocked')==='yes')document.getElementById('lockScreen').style.display='none';

fb.onValue(presenceRef,s=>{presenceData=s.val()||{};const o=presenceData[otherUser];const el=document.getElementById('statusText');if(o&&o.online){el.textContent='● Active now';el.className='text-[11px] text-green-400';}else if(o&&o.last){el.textContent='● '+timeAgo(o.last);el.className='text-[11px] text-white/50';}else{el.textContent='● Offline';el.className='text-[11px] text-white/50';}});
setInterval(()=>{const o=presenceData[otherUser];if(o&&!o.online&&o.last){document.getElementById('statusText').textContent='● '+timeAgo(o.last);}},60000);

const messagesEl=document.getElementById('messages');
function tick(s){if(s==='seen')return '<span style="color:#53bdeb">✓✓ Seen</span>';if(s==='delivered')return '✓✓ Delivered';return '✓ Sent';}

function render(snap){
const d=snap.val();if(!d)return null;const isMe=d.sender===currentUser;
const div=document.createElement('div');div.className=`flex ${isMe?'justify-end':'justify-start'}`;div.id='msg-'+snap.key;
let c='';
if(d.deleted){c=`<div class="italic opacity-60">🚫 ${d.deletedBy} unsent a message</div>`;}
else if(d.type==='image')c=`<img src="${d.text}" class="rounded-xl max-w-[230px]">`;
else if(d.type==='video')c=`<video controls playsinline src="${d.text}" class="rounded-xl max-w-[240px] max-h-[300px]"></video>`;
else if(d.type==='file')c=`<a href="${d.text}" download="${d.fileName}" class="underline">📎 ${d.fileName}</a>`;
else if(d.type==='audio')c=`<div class="voice-box"><button class="aplay w-9 h-9 bg-white/20 rounded-full flex items-center justify-center" data-key="${snap.key}">▶️</button><div class="wave"><i></i><i style="height:16px"></i><i style="height:20px"></i><i style="height:12px"></i><i></i></div><span class="text-xs opacity-70">Voice</span><audio id="aud-${snap.key}" src="${d.text}"></audio></div>`;
else c=`<div class="whitespace-pre-wrap break-words">${d.text}</div>`;
div.innerHTML=`<div class="${isMe?'msg-me':'msg-other'} ${d.deleted?'!bg-transparent border border-white/20':''} px-4 py-2.5 max-w-[80%] text-white text-[14px]">${c}<div class="text-[9px] opacity-60 mt-1 flex justify-between gap-3"><span>${d.time||''}</span><span>${d.deleted?'':isMe?tick(d.status||'sent'):d.sender}</span></div></div>`;

const showMenu=(e)=>{
 selectedKey=snap.key;selectedIsMe=isMe;
 const m=document.getElementById('contextMenu');
 if(d.deleted){ m.innerHTML=`<button onclick="menuAction('me')" class="w-full text-left px-4 py-3 text-[13px] text-white">🗑️ Remove for you</button>`; }
 else if(isMe){ m.innerHTML=`<button onclick="menuAction('everyone')" class="w-full text-left px-4 py-3 text-[13px] text-white">🚫 Unsend for Everyone</button><button onclick="menuAction('me')" class="w-full text-left px-4 py-3 text-[13px] text-white">🗑️ Delete for me only</button>`; }
 else { m.innerHTML=`<button onclick="menuAction('me')" class="w-full text-left px-4 py-3 text-[13px] text-white">🗑️ Delete for me only</button><div class="px-4 py-2 text-[11px] text-white/40">You can't unsend others messages</div>`; }
 m.style.left=(e.pageX||30)+'px';m.style.top=(e.pageY||100)+'px';m.classList.remove('hidden');
};
div.oncontextmenu=e=>{e.preventDefault();showMenu(e);};let t;div.addEventListener('touchstart',e=>{t=setTimeout(()=>showMenu(e.touches[0]),600);});div.addEventListener('touchend',()=>clearTimeout(t));
div.querySelectorAll('.aplay').forEach(b=>{
 b.onclick=()=>{
  const aud=document.getElementById('aud-'+b.dataset.key);
  if(aud.paused){document.querySelectorAll('audio').forEach(x=>x.pause()); aud.play(); b.textContent='⏸️';}
  else{aud.pause(); b.textContent='▶️';}
  aud.onended=()=>b.textContent='▶️';
 };
});
return div;
}

fb.onChildAdded(fb.query(messagesRef,fb.orderByChild('ts')),snap=>{
 if(localStorage.getItem('deleted_me_'+snap.key)) return;
 const el=render(snap); if(!el)return; messagesEl.appendChild(el); messagesEl.scrollTop=messagesEl.scrollHeight;
 const d=snap.val(); if(d.sender!==currentUser && !d.deleted){ fb.update(fb.ref(db,'sm_v2_messages/'+snap.key),{status:'seen'}); }
});
fb.onChildChanged(messagesRef,snap=>{
 const old=document.getElementById('msg-'+snap.key); if(old){const ne=render(snap); if(ne) old.replaceWith(ne);}
});
fb.onChildRemoved(messagesRef,snap=>{const el=document.getElementById('msg-'+snap.key); if(el) el.remove();});

window.menuAction=async type=>{
 document.getElementById('contextMenu').classList.add('hidden'); if(!selectedKey) return;
 if(type==='me'){ localStorage.setItem('deleted_me_'+selectedKey,'1'); const el=document.getElementById('msg-'+selectedKey); if(el) el.remove(); }
 if(type==='everyone'){ if(!selectedIsMe){alert("You can't unsend others message"); return;} await fb.update(fb.ref(db,'sm_v2_messages/'+selectedKey),{deleted:true,deletedBy:currentUser}); }
};

async function send(){if(!currentUser){alert('Select user');return;}const txt=document.getElementById('msgInput').value.trim();if(!txt&&!pendingImage&&!pendingVideo&&!pendingFile&&!pendingAudio)return;let p={sender:currentUser,time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),ts:Date.now(),status:'sent'};if(pendingImage){p.text=pendingImage;p.type='image';}else if(pendingVideo){p.text=pendingVideo;p.type='video';}else if(pendingFile){p.text=pendingFile.data;p.type='file';p.fileName=pendingFile.name;}else if(pendingAudio){p.text=pendingAudio;p.type='audio';}else{p.text=txt;p.type='text';}document.getElementById('msgInput').value='';cancelPreview();await fb.push(messagesRef,p);}
document.getElementById('sendBtn').onclick=send;
document.getElementById('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
window.cancelPreview=()=>{pendingImage=null;pendingVideo=null;pendingFile=null;pendingAudio=null;document.getElementById('previewBox').classList.add('hidden');};

document.getElementById('imgInput').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 if(f.type.startsWith('video/')){const r=new FileReader();r.onload=()=>{pendingVideo=r.result;document.getElementById('previewText').textContent='🎬 Video ready';document.getElementById('previewBox').classList.remove('hidden');};r.readAsDataURL(f);}
 else{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const max=800;let w=img.width,h=img.height;if(w>max||h>max){if(w>h){h*=max/w;w=max;}else{w*=max/h;h=max;}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);pendingImage=c.toDataURL('image/jpeg',0.6);document.getElementById('previewText').textContent='📷 Photo ready';document.getElementById('previewBox').classList.remove('hidden');};img.src=r.result;};r.readAsDataURL(f);}
};
document.getElementById('fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{pendingFile={data:r.result,[STRIPPED] File: '+f.name;document.getElementById('previewBox').classList.remove('hidden');};r.readAsDataURL(f);};

let mr,ac=[];document.getElementById('micBtn').onclick=async()=>{
 const b=document.getElementById('micBtn');
 if(mr&&mr.state==='recording'){mr.stop();b.textContent='🎙️';b.classList.remove('bg-red-600');return;}
 try{const s=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(s);ac=[];mr.ondataavailable=e=>ac.push(e.data);mr.onstop=()=>{const bl=new Blob(ac,{type:'audio/webm'});const r=new FileReader();r.onload=()=>{pendingAudio=r.result;document.getElementById('previewText').textContent='🎤 Voice ready - send';document.getElementById('previewBox').classList.remove('hidden');};r.readAsDataURL(bl);s.getTracks().forEach(t=>t.stop());};mr.start();b.textContent='⏹️';b.classList.add('bg-red-600');document.getElementById('previewText').textContent='🔴 Recording...';document.getElementById('previewBox').classList.remove('hidden');}catch{alert('Mic permission');}
};

// CALL
const ice={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};function createPC(){pc=new RTCPeerConnection(ice);pc.onicecandidate=e=>{if(e.candidate)fb.push(fb.ref(db,'sm_calls/candidates/'+currentUser),e.candidate.toJSON());};pc.ontrack=e=>{document.getElementById('remoteVideo').srcObject=e.streams[0];};return pc;}
function startTimer(){let s=0;timerInt=setInterval(()=>{s++;const m=String(Math.floor(s/60)).padStart(2,'0');const sec=String(s%60).padStart(2,'0');document.getElementById('callTimer').textContent=m+':'+sec;},1000);}
async function startCall(t){if(!currentUser){alert('Select');return;}otherUser=currentUser==='Sohel'?'Mou':'Sohel';const on=presenceData[otherUser]&&presenceData[otherUser].online;document.getElementById('callScreen').classList.remove('hidden');document.getElementById('callName').textContent=on?'Ringing...':'Calling...';document.getElementById('callTone').play().catch(()=>{});localStream=await navigator.mediaDevices.getUserMedia({video:t==='video',audio:true});document.getElementById('localVideo').srcObject=localStream;const p1=createPC();localStream.getTracks().forEach(tr=>p1.addTrack(tr,localStream));const off=await p1.createOffer();await p1.setLocalDescription(off);await fb.set(callRef,{offer:{type:off.type,sdp:off.sdp},caller:currentUser,callee:otherUser,type:t,state:'calling'});}
async function acceptCall(d){document.getElementById('incomingBox').classList.add('hidden');document.getElementById('callScreen').classList.remove('hidden');document.getElementById('callName').textContent='Connected';document.getElementById('ringTone').pause();document.getElementById('callTone').pause();localStream=await navigator.mediaDevices.getUserMedia({video:d.type==='video',audio:true});document.getElementById('localVideo').srcObject=localStream;const p2=createPC();localStream.getTracks().forEach(tr=>p2.addTrack(tr,localStream));await p2.setRemoteDescription(new RTCSessionDescription(d.offer));const ans=await p2.createAnswer();await p2.setLocalDescription(ans);await fb.set(fb.ref(db,'sm_calls/current/answer'),{type:ans.type,sdp:ans.sdp});await fb.set(fb.ref(db,'sm_calls/current/state'),'connected');startTimer();}
function endCall(){if(pc)pc.close();pc=null;if(localStream)localStream.getTracks().forEach(t=>t.stop());clearInterval(timerInt);document.getElementById('ringTone').pause();document.getElementById('callTone').pause();document.getElementById('callScreen').classList.add('hidden');fb.remove(callRef);}
fb.onValue(callRef,async s=>{const d=s.val();if(!d||!currentUser)return;if(d.state==='calling'&&d.callee===currentUser){document.getElementById('incomingText').textContent=d.caller+' calling...';document.getElementById('incomingBox').classList.remove('hidden');window._in=d;document.getElementById('ringTone').play().catch(()=>{});}if(d.answer&&d.caller===currentUser&&pc){await pc.setRemoteDescription(new RTCSessionDescription(d.answer));document.getElementById('callName').textContent='Connected';document.getElementById('callTone').pause();startTimer();}});
document.getElementById('voiceBtn').onclick=()=>startCall('voice');document.getElementById('videoBtn').onclick=()=>startCall('video');document.getElementById('acceptBtn').onclick=()=>{if(window._in)acceptCall(window._in);};document.getElementById('declineBtn').onclick=()=>{document.getElementById('ringTone').pause();document.getElementById('callTone').pause();fb.remove(callRef);document.getElementById('incomingBox').classList.add('hidden');};document.getElementById('endBtn').onclick=endCall;document.getElementById('muteBtn').onclick=e=>{if(localStream)localStream.getAudioTracks().forEach(t=>t.enabled=!t.enabled);e.currentTarget.textContent=e.currentTarget.textContent==='🎤'?'🔇':'🎤';};document.getElementById('whoami').onclick=()=>{localStorage.removeItem('sm_user');location.reload();};document.addEventListener('click',()=>document.getElementById('contextMenu').classList.add('hidden'));
</script>
</body>
</html>
