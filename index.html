<style>
body{font-family:sans-serif;background:#0b141a}

.react-picker{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#233138;border-radius:30px;padding:8px 14px;display:flex;gap:12px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,0.7)}

</style>

<body class="h-[100dvh] flex flex-col max-w-[480px] mx-auto relative text-white">
<audio id="remoteAudio" autoplay playsinline></audio>
<div id="lightbox" onclick="this.style.display='none'"><img id="lbImg" style="display:none"><video id="lbVideo" controls playsinline style="display:none"></video><p class="absolute bottom-6 text-white/50 text-xs">Tap to close • Pinch to zoom</p></div>

<header class="bg-[#202c33] p-3 flex items-center justify-between">
<div class="flex items-center gap-2.5"><div class="w-9 h-9 rounded-full bg-[#25d366] flex items-center justify-center font-bold text-sm">SM</div><div><h1 id="headerName" class="text-[15px] font-semibold">Select User</h1><p id="statusText" class="text-[11px] text-white/60">Select koro</p></div></div>

<!-- WHATSAPP STYLE CALL -->

</div>

<button onclick="doReply()" class="w-full py-3 text-left flex items-center gap-3"><span>↩️</span> Reply</button>

<button onclick="closeActionMenu()" class="w-full py-3 mt-2 bg-white/10 rounded-full text-center">Cancel</button>
</div>

<script>
var currentUser='', otherUser='', replyData=null, pendingImage=null, pendingVideo=null, pendingFile=null, pendingAudio=null, selectedMsgKey=null, selectedMsgData=null;

function setUser(n){
  currentUser=n; otherUser=(n==='Sohel'?'Mou':'Sohel');
  localStorage.setItem('sm_user',n);
  document.getElementById('headerName').innerText=otherUser;
  var st=document.getElementById('statusText');
  st.innerText='tap here for contact info';
  st.style.color='#8696a0';
  document.getElementById('whoamiBtn').innerText=n;
  document.getElementById('nameBox').style.display='none';
  try{ db.ref('smMessenger/presence/'+n).set({online:true}); }catch(e){}
  loadMessages();
}

var firebaseConfig={apiKey:"AIzaSyD-2OqkcSev3XzcAt4-p2kGLkGYYqL8hzE",authDomain:"sm-chat-da9f7.firebaseapp.com",projectId:"sm-chat-da9f7",databaseURL:"https://sm-chat-da9f7-default-rtdb.asia-southeast1.firebasedatabase.app"};
firebase.initializeApp(firebaseConfig);
var db=firebase.database();
var messagesRef=db.ref("smMessenger/messages/SM_ROOM");
var callRef=db.ref("sm_calls/current");
var pc, localStream, timerInt, speakerOn=false, incomingData=null, isMuted=false;

var cu=localStorage.getItem('sm_user'); if(cu) setTimeout(function(){setUser(cu)},600);

function loadMessages(){
  messagesRef.on('value',function(snap){
    if(!currentUser){document.getElementById('messages').innerHTML='<div class="text-center text-white/30 text-xs mt-20">Select Sohel or Mou</div>';return;}
    var el=document.getElementById('messages'); el.innerHTML='';
    snap.forEach(function(child){
      var d=child.val(); if(!d) return;
      // Hide if deleted for me by current user
      if(d.deletedFor && d.deletedFor[currentUser]) return;
      var isMe=d.sender===currentUser;
      var wrap=document.createElement('div'); wrap.className='msg-wrap flex '+(isMe?'justify-end':'justify-start')+' mb-1';
      var status='✓'; var sClass='status';
      if(d.readByOther){status='✓✓'; sClass='status seen';} else if(d.delivered){status='✓✓';}
      var replyHtml=d.replyTo?'<div class="reply-preview"><b style="color:#25d366">'+d.replyTo.sender+'</b><br>'+d.replyTo.text.substring(0,50)+'</div>':'';
      var reactHtml=d.reacts&&Object.values(d.reacts).length?'<div class="react-bar">'+Object.values(d.reacts).join('')+'</div>':'';
      var content='';
      if(d.deleted){ content='<div style="opacity:0.6;font-style:italic;font-size:13px">🚫 You unsent a message</div>'; }
      else if(d.type==='image') content='<img src="'+d.data+'" style="max-width:230px;border-radius:8px;cursor:pointer">';
      else if(d.type==='video') content='<video src="'+d.data+'" style="max-width:240px;border-radius:8px" controls playsinline></video>';
      else if(d.type==='file') content='<a href="'+d.data+'" download="'+d.fileName+'" style="text-decoration:underline">📎 '+d.fileName+'</a>';
      else if(d.type==='audio') content='<audio controls src="'+d.data+'" style="width:200px"></audio>';
      else content='<div style="white-space:pre-wrap;word-break:break-word">'+(d.text||'')+'</div>';
      wrap.innerHTML='<div class="'+(isMe?'msg-me':'msg-other')+' px-3 py-2 max-w-[78%] text-white text-[14.2px] relative shadow-sm">'+replyHtml+content+reactHtml+'<div class="'+sClass+'"><span>'+(d.time||'')+'</span><span>'+(isMe?status:'')+'</span></div></div>';
      el.appendChild(wrap);
      if(!isMe && !d.delivered) db.ref('smMessenger/messages/SM_ROOM/'+child.key).update({delivered:true});
      if(!isMe && !d.readByOther) setTimeout(function(){db.ref('smMessenger/messages/SM_ROOM/'+child.key).update({readByOther:true})},800);

      // Click for zoom
      var imgEl=wrap.querySelector('img'); if(imgEl){ imgEl.onclick=function(){ openLb(imgEl.src,'image'); }; }
      
      // Swipe to reply
      var sx=0,cx=0,sw=false;
      wrap.addEventListener('touchstart',function(e){sx=e.touches[0].clientX; sw=true},{passive:true});
      wrap.addEventListener('touchmove',function(e){if(!sw) return; cx=e.touches[0].clientX-sx; if(cx>0&&cx<90) wrap.style.transform='translateX('+cx+'px)'},{passive:true});
      wrap.addEventListener('touchend',function(){wrap.style.transform='translateX(0)'; if(cx>55) setReply(d.sender,d.text||'media'); sw=false; cx=0;});

      // Long press menu for delete/unsend
      var pressTimer;
      wrap.addEventListener('touchstart',function(){ pressTimer=setTimeout(function(){ openActionMenu(child.key,d); },600); });
      wrap.addEventListener('touchend',function(){ clearTimeout(pressTimer); });
      wrap.addEventListener('contextmenu',function(e){ e.preventDefault(); openActionMenu(child.key,d); });
    });
    el.scrollTop=el.scrollHeight;
  });
}

function openActionMenu(key,data){ selectedMsgKey=key; selectedMsgData=data; document.getElementById('msgActionMenu').classList.remove('hidden'); if(navigator.vibrate) navigator.vibrate(40); }
function closeActionMenu(){ document.getElementById('msgActionMenu').classList.add('hidden'); }
function doReply(){ closeActionMenu(); setReply(selectedMsgData.sender, selectedMsgData.text||'media'); }
function doReact(){ closeActionMenu(); showReact(selectedMsgKey); }
function doUnsend(){ 
  if(selectedMsgData.sender!==currentUser){ alert('Only your message can be unsent'); closeActionMenu(); return; }
  db.ref('smMessenger/messages/SM_ROOM/'+selectedMsgKey).update({deleted:true, text:'', data:null}); 
  closeActionMenu();
}
function doDeleteMe(){
  var updates={}; updates['smMessenger/messages/SM_ROOM/'+selectedMsgKey+'/deletedFor/'+currentUser]=true;
  db.ref().update(updates);
  closeActionMenu();
}
function showReact(key){
  var old=document.querySelector('.react-picker'); if(old) old.remove();
  var picker=document.createElement('div'); picker.className='react-picker';
  ['❤️','😂','😮','😢','😡','👍'].forEach(function(em){
    var b=document.createElement('button'); b.innerText=em; b.style.fontSize='24px';
    b.onclick=function(){db.ref('smMessenger/messages/SM_ROOM/'+key+'/reacts/'+currentUser).set(em); picker.remove();};
    picker.appendChild(b);
  });
  document.body.appendChild(picker);
  setTimeout(function(){if(picker.parentNode) picker.remove()},4000);
}
function setReply(s,t){replyData={sender:s,text:t}; document.getElementById('replyToName').innerText=s; document.getElementById('replyToText').innerText=t.substring(0,60); document.getElementById('replyBox').classList.remove('hidden'); document.getElementById('msgInput').focus();}
function cancelReply(){replyData=null; document.getElementById('replyBox').classList.add('hidden');}
function openLb(src,type){
  var lb=document.getElementById('lightbox'); var i=document.getElementById('lbImg'); var v=document.getElementById('lbVideo');
  lb.style.display='flex'; i.style.transform='scale(1)';
  if(type==='video'){v.src=src; v.style.display='block'; i.style.display='none'; v.play();}
  else{
    i.src=src; i.style.display='block'; v.style.display='none';
    // Pinch zoom simple
    var scale=1; i.addEventListener('touchmove',function(e){
      if(e.touches.length===2){
        var dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
        if(!i._lastDist) i._lastDist=dist;
        scale=Math.min(Math.max(1, scale*(dist/i._lastDist)),3);
        i.style.transform='scale('+scale+')';
        i._lastDist=dist;
      }
    },{passive:true});
    i.addEventListener('touchend',function(){ i._lastDist=null; });
  }
}
function sendMessage(){
  var text=document.getElementById('msgInput').value.trim();
  if(!text && !pendingImage && !pendingVideo && !pendingFile && !pendingAudio) return;
  if(!currentUser){alert('Age I am Sohel / Mou select koro');return;}
  var obj={sender:currentUser,text:text,time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),createdAt:firebase.database.ServerValue.TIMESTAMP,delivered:false,readByOther:false,type:'text'};
  if(replyData) obj.replyTo={sender:replyData.sender,text:replyData.text};
  if(pendingImage){obj.data=pendingImage; obj.type='image'; obj.text='';}
  if(pendingVideo){obj.data=pendingVideo; obj.type='video'; obj.text='';}
  if(pendingFile){obj.data=pendingFile.data; obj.fileName=pendingFile.name; obj.type='file'; obj.text='';}
  if(pendingAudio){obj.data=pendingAudio; obj.type='audio'; obj.text='';}
  document.getElementById('msgInput').value=''; cancelPreview(); cancelReply();
  messagesRef.push(obj);
}
function cancelPreview(){pendingImage=null;pendingVideo=null;pendingFile=null;pendingAudio=null;document.getElementById('previewBox').classList.add('hidden');}
function fileToDataURL(f){return new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result);};r.readAsDataURL(f);});}
document.getElementById('imgInput').addEventListener('change',async function(e){var f=e.target.files[0];if(!f) return;var data=await fileToDataURL(f);if(f.type.startsWith('image/')){var img=new Image(); img.src=data; await new Promise(function(r){img.onload=r;}); var c=document.createElement('canvas'); var w=img.width,h=img.height; var max=1000; if(w>max||h>max){if(w>h){h*=max/w;w=max;}else{w*=max/h;h=max;}} c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);data=c.toDataURL('image/jpeg',0.7);pendingImage=data;}else{pendingVideo=data;}document.getElementById('previewText').innerText='📷 Photo/Video ready';document.getElementById('previewBox').classList.remove('hidden');e.target.value='';});
document.getElementById('fileInput').addEventListener('change',async function(e){var f=e.target.files[0];if(!f) return;var data=await fileToDataURL(f);pendingFile={data:data,name:f.name};document.getElementById('previewText').innerText='📎 '+f.name;document.getElementById('previewBox').classList.remove('hidden');e.target.value='';});
var mr,ac=[];document.getElementById('micBtn').addEventListener('click',async function(){var b=this; if(mr&&mr.state==='recording'){mr.stop(); b.innerText='🎙️'; return;} try{var s=await navigator.mediaDevices.getUserMedia({audio:true}); mr=new MediaRecorder(s); ac=[]; mr.ondataavailable=function(e){ac.push(e.data);}; mr.onstop=function(){var bl=new Blob(ac,{type:'audio/webm'}); var r=new FileReader(); r.onload=function(){pendingAudio=r.result; document.getElementById('previewText').innerText='🎤 Voice ready'; document.getElementById('previewBox').classList.remove('hidden');}; r.readAsDataURL(bl); s.getTracks().forEach(function(t){t.stop();});}; mr.start(); b.innerText='⏹️';}catch(e){alert('Mic allow');}});
document.getElementById('msgInput').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});
document.getElementById('whoamiBtn').addEventListener('click',function(){localStorage.removeItem('sm_user');location.reload();});

// CALL - WHATSAPP THEME + MUTE FIX
function createPC(){pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]}); pc.onicecandidate=function(e){if(e.candidate) db.ref('sm_calls/candidates/'+currentUser).push(e.candidate.toJSON());}; pc.ontrack=function(e){var rv=document.getElementById('remoteVideo'); var ra=document.getElementById('remoteAudio'); if(e.track.kind==='video'){rv.srcObject=e.streams[0]; rv.classList.remove('hidden'); rv.play(); document.getElementById('callAvatar').style.display='none'; document.getElementById('callStatusText').style.display='none';} if(e.track.kind==='audio'){ra.srcObject=e.streams[0]; ra.play();}}; return pc;}
function listenCan(o){db.ref('sm_calls/candidates/'+o).on('value',function(s){s.forEach(function(c){var v=c.val(); if(v&&pc) pc.addIceCandidate(new RTCIceCandidate(v)).catch(function(){});});});}
function startTimer(){var s=0; timerInt=setInterval(function(){s++; var m=String(Math.floor(s/60)).padStart(2,'0'); var sec=String(s%60).padStart(2,'0'); document.getElementById('callTimer').innerText=m+':'+sec; document.getElementById('callStatusText').innerText='● '+m+':'+sec;},1000);}
async function startCall(v){if(!currentUser){alert('Age select koro');return;} otherUser=currentUser==='Sohel'?'Mou':'Sohel'; document.getElementById('callScreen').classList.remove('hidden'); document.getElementById('callName').innerText=otherUser; document.getElementById('callTimer').innerText='Calling...'; try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:!!v});}catch(e){alert('Allow camera/mic');return;} document.getElementById('localVideo').srcObject=localStream; if(v) document.getElementById('localVideo').classList.remove('hidden'); var p1=createPC(); localStream.getTracks().forEach(function(t){p1.addTrack(t,localStream);}); var off=await p1.createOffer(); await p1.setLocalDescription(off); await callRef.set({offer:{type:off.type,sdp:off.sdp},caller:currentUser,callee:otherUser,type:v?'video':'voice',state:'calling'}); listenCan(otherUser);}
async function acceptCall(){var d=incomingData; if(!d) return; document.getElementById('incomingBox').classList.add('hidden'); document.getElementById('callScreen').classList.remove('hidden'); document.getElementById('callName').innerText=d.caller; try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:d.type==='video'});}catch(e){return;} document.getElementById('localVideo').srcObject=localStream; if(d.type==='video') document.getElementById('localVideo').classList.remove('hidden'); var p2=createPC(); localStream.getTracks().forEach(function(t){p2.addTrack(t,localStream);}); await p2.setRemoteDescription(new RTCSessionDescription(d.offer)); var ans=await p2.createAnswer(); await p2.setLocalDescription(ans); await db.ref('sm_calls/current/answer').set({type:ans.type,sdp:ans.sdp}); await db.ref('sm_calls/current/state').set('connected'); listenCan(d.caller); startTimer();}
function endCall(){try{db.ref('sm_calls/candidates/'+currentUser).remove(); db.ref('sm_calls/candidates/'+otherUser).remove();}catch(e){} if(pc)pc.close(); pc=null; if(localStream)localStream.getTracks().forEach(function(t){t.stop();}); clearInterval(timerInt); isMuted=false; document.getElementById('muteIcon').style.background='#202c33'; document.getElementById('muteIcon').innerText='🎤'; document.getElementById('callScreen').classList.add('hidden'); document.getElementById('remoteVideo').srcObject=null; document.getElementById('remoteVideo').classList.add('hidden'); document.getElementById('remoteAudio').srcObject=null; document.getElementById('callAvatar').style.display='block'; document.getElementById('callStatusText').style.display='block'; callRef.remove();}
function declineCall(){callRef.remove(); document.getElementById('incomingBox').classList.add('hidden');}
callRef.on('value',async function(s){var d=s.val(); if(!d||!currentUser) return; if(d.state==='calling'&&d.callee===currentUser){incomingData=d; document.getElementById('incomingText').innerText=d.caller+' calling...'; document.getElementById('incomingBox').classList.remove('hidden');} if(d.answer&&d.caller===currentUser&&pc){try{await pc.setRemoteDescription(new RTCSessionDescription(d.answer));}catch(e){} startTimer();}});

// MUTE FIX - 100% WORKING
document.getElementById('muteBtn').addEventListener('click',function(){
  if(!localStream) return;
  isMuted=!isMuted;
  localStream.getAudioTracks().forEach(function(t){ t.enabled=!isMuted; });
  var icon=document.getElementById('muteIcon');
  if(isMuted){ icon.style.background='#f15c6d'; icon.innerText='🔇'; }
  else{ icon.style.background='#202c33'; icon.innerText='🎤'; }
  if(navigator.vibrate) navigator.vibrate(30);
});
document.getElementById('speakerBtn').addEventListener('click',function(){
  speakerOn=!speakerOn;
  var ra=document.getElementById('remoteAudio'); ra.volume=speakerOn?1.0:0.35;
  var icon=document.getElementById('speakerIcon');
  if(speakerOn){ icon.style.background='#25d366'; icon.style.color='black'; } else { icon.style.background='#202c33'; icon.style.color='white'; }
});

// DRAG SMALL VIDEO
var localVideo=document.getElementById('localVideo'); var callVideoArea=document.getElementById('callVideoArea'); var isDragging=false, sx, sy, il, it;
function getPos(e){return e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY};}
function sd(e){if(localVideo.classList.contains('hidden')) return; isDragging=true; var p=getPos(e); var r=localVideo.getBoundingClientRect(); var pr=callVideoArea.getBoundingClientRect(); sx=p.x; sy=p.y; il=r.left-pr.left; it=r.top-pr.top; e.preventDefault();}
function od(e){if(!isDragging) return; var p=getPos(e); var nl=il+(p.x-sx); var nt=it+(p.y-sy); var pr=callVideoArea.getBoundingClientRect(); var vr=localVideo.getBoundingClientRect(); nl=Math.max(0,Math.min(nl,pr.width-vr.width-8)); nt=Math.max(0,Math.min(nt,pr.height-vr.height-8)); localVideo.style.left=nl+'px'; localVideo.style.top=nt+'px'; localVideo.style.right='auto'; localVideo.style.bottom='auto'; e.preventDefault();}
function ed(){isDragging=false;}
localVideo.addEventListener('mousedown',sd); localVideo.addEventListener('touchstart',sd,{passive:false});
window.addEventListener('mousemove',od); window.addEventListener('touchmove',od,{passive:false});
window.addEventListener('mouseup',ed); window.addEventListener('touchend',ed);
</script>
</body>
</html>
