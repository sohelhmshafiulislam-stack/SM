<script>
var currentUser='', otherUser='';
function setUser(n){
 currentUser=n; otherUser=n==='Sohel'?'Mou':'Sohel';
 localStorage.setItem('sm_user',n);
 var hn=document.getElementById('headerName');
 var st=document.getElementById('statusText');
 var wb=document.getElementById('whoami');
 var nb=document.getElementById('nameBox');
 if(hn) hn.textContent=otherUser+' ❤️';
 if(st){st.textContent='● Active now'; st.className='text-[11px] text-green-400';}
 if(wb) wb.textContent=n;
 if(nb) nb.style.display='none';
 console.log('Selected:',n);
 // Try firebase presence if loaded
 if(window.fb && window.db){
   try{
     var myRef=window.fb.ref(window.db,'smMessenger/presence/'+n);
     window.fb.set(myRef,{online:true,lastSeen:window.fb.serverTimestamp()});
     window.fb.onDisconnect(myRef).update({online:false,lastSeen:window.fb.serverTimestamp()});
   }catch(e){console.log(e);}
 }
}
document.addEventListener('DOMContentLoaded',function(){
 var bS=document.getElementById('btnSohel');
 var bM=document.getElementById('btnMou');
 if(bS) bS.addEventListener('click',function(){setUser('Sohel');});
 if(bM) bM.addEventListener('click',function(){setUser('Mou');});
 var cu=localStorage.getItem('sm_user')||'';
 if(cu){ setTimeout(function(){ setUser(cu); },500); }
 document.getElementById('whoami').addEventListener('click',function(){localStorage.removeItem('sm_user');location.reload();});
 document.getElementById('lightboxClose').addEventListener('click',function(){document.getElementById('lightbox').style.display='none';});
});
</script>

function render(child){const d=child.val(); if(!d) return null; if(localStorage.getItem('deleted_me_'+child.key)) return null; const isMe=d.sender===currentUser; const div=document.createElement('div'); div.className=`flex ${isMe?'justify-end':'justify-start'} relative`; div.id='msg-'+child.key; let c=''; if(d.deleted){c=`<div class="italic opacity-60 text-[13px]">🚫 ${d.deletedBy} unsent</div>`;} else if(d.type==='image') c=`<img src="${d.data}" class="rounded-xl max-w-[230px] cursor-zoom-in">`; else if(d.type==='video') c=`<video src="${d.data}" class="rounded-xl max-w-[240px] max-h-[300px] bg-black"></video>`; else if(d.type==='file') c=`<a href="${d.data}" download="${d.fileName}" class="underline">📎 ${d.fileName}</a>`; else if(d.type==='audio') c=`<div class="flex items-center gap-2 min-w-[180px]"><button class="aplay w-8 h-8 bg-white/20 rounded-full" data-key="${child.key}">▶️</button><audio id="aud-${child.key}" src="${d.data}"></audio><span class="text-xs">Voice</span></div>`; else c=`<div class="whitespace-pre-wrap break-words">${d.text||''}</div>`; let reactHtml=''; if(d.reacts){const emojis=Object.values(d.reacts).join(''); reactHtml=`<div class="react-bar text-[12px]">${emojis}</div>`;} div.innerHTML=`<div class="${isMe?'msg-me':'msg-other'} px-4 py-2.5 max-w-[78%] text-white text-[14px] relative">${c}${reactHtml}<div class="text-[9px] opacity-60 mt-1 flex justify-between gap-3"><span>${d.time||''}</span><span>${d.deleted?'':isMe?(d.readByOther?'✓✓ Seen':'✓✓ Delivered'):d.sender}</span></div></div>`; const img=div.querySelector('img'); if(img){img.addEventListener('click',()=>openLightbox(img.src,'image'));} const vid=div.querySelector('video'); if(vid){vid.addEventListener('click',()=>openLightbox(vid.src,'video'));} const show=(e)=>{selectedKey=child.key; selectedIsMe=isMe; const m=document.getElementById('contextMenu'); m.innerHTML=`<div class="flex justify-around p-2 border-b border-white/10 text-xl"><button class="reactBtn" data-e="❤️">❤️</button><button class="reactBtn" data-e="😂">😂</button><button class="reactBtn" data-e="😮">😮</button><button class="reactBtn" data-e="😢">😢</button><button class="reactBtn" data-e="😡">😡</button><button class="reactBtn" data-e="👍">👍</button></div>${d.deleted?`<button class="menuMe w-full text-left px-4 py-2.5 text-[13px]">🗑️ Delete for me</button>`:isMe?`<button class="menuEvery w-full text-left px-4 py-2.5 text-[13px]">🚫 Unsend</button><button class="menuMe w-full text-left px-4 py-2.5 text-[13px]">🗑️ Delete for me</button>`:`<button class="menuMe w-full text-left px-4 py-2.5 text-[13px]">🗑️ Delete for me</button>`}`; m.style.left=(e.pageX||30)+'px'; m.style.top=(e.pageY||80)+'px'; m.classList.remove('hidden'); m.querySelectorAll('.reactBtn').forEach(b=>b.addEventListener('click',()=>addReact(b.dataset.e))); m.querySelectorAll('.menuMe').forEach(b=>b.addEventListener('click',()=>menuAction('me'))); const evBtn=m.querySelector('.menuEvery'); if(evBtn) evBtn.addEventListener('click',()=>menuAction('everyone')); }; div.oncontextmenu=e=>{e.preventDefault();show(e);}; let t; div.addEventListener('touchstart',e=>{t=setTimeout(()=>show(e.touches[0]),650);}); div.addEventListener('touchend',()=>clearTimeout(t)); div.querySelectorAll('.aplay').forEach(b=>{b.addEventListener('click',()=>{const aud=document.getElementById('aud-'+b.dataset.key);if(aud.paused){aud.play();b.textContent='⏸️';}else{aud.pause();b.textContent='▶️';} aud.onended=()=>b.textContent='▶️';});}); return div;}
fb.onValue(messagesRef,snap=>{if(!currentUser){messagesEl.innerHTML='<div class="text-center text-white/30 text-xs mt-10">Select Sohel or Mou to start chatting</div>'; return;} messagesEl.innerHTML=''; snap.forEach(child=>{const el=render(child); if(el) messagesEl.appendChild(el); const d=child.val(); if(d.sender!==currentUser && !d.readByOther && !d.deleted){fb.update(fb.ref(db,'smMessenger/messages/SM_ROOM/'+child.key),{readByOther:true}); document.getElementById('msgTone').play().catch(()=>{});}}); messagesEl.scrollTop=messagesEl.scrollHeight;});
async function addReact(emoji){document.getElementById('contextMenu').classList.add('hidden'); if(!selectedKey) return; const r=fb.ref(db,'smMessenger/messages/SM_ROOM/'+selectedKey+'/reacts/'+currentUser); const snap=await new Promise(res=>fb.onValue(r,s=>res(s),{onlyOnce:true})); if(snap.val()===emoji) fb.remove(r); else fb.set(r,emoji);}
async function menuAction(type){document.getElementById('contextMenu').classList.add('hidden'); if(!selectedKey) return; if(type==='me'){localStorage.setItem('deleted_me_'+selectedKey,'1'); const el=document.getElementById('msg-'+selectedKey); if(el) el.remove();} if(type==='everyone'){if(!selectedIsMe) return; await fb.update(fb.ref(db,'smMessenger/messages/SM_ROOM/'+selectedKey),{deleted:true,deletedBy:currentUser});}}
async function sendMessage(extra={}){let text=document.getElementById('msgInput').value.trim(); if(!text && !extra.data && !pendingImage && !pendingVideo && !pendingFile && !pendingAudio) return; if(!currentUser){alert('Age I am Sohel / Mou select koro!'); return;} let obj={sender:currentUser,text,createdAt:fb.serverTimestamp(),time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),type:'text',readByOther:false,...extra}; if(pendingImage){obj={...obj,data:pendingImage,type:'image'}} if(pendingVideo){obj={...obj,data:pendingVideo,type:'video'}} if(pendingFile){obj={...obj,data:pendingFile.data,fileName:pendingFile.name,type:'file'}} if(pendingAudio){obj={...obj,data:pendingAudio,type:'audio'}} document.getElementById('msgInput').value=''; cancelPreview(); await fb.push(messagesRef,obj);}

async function setSpeaker(on){speakerOn=on; const ra=document.getElementById('remoteAudio'); ra.volume=on?1.0:0.28; const btn=document.getElementById('speakerBtn'); const d=btn.querySelector('div'); const t=btn.querySelector('span'); if(on){d.style.background='#2a7cff';d.textContent='🔊';t.textContent='Speaker ON';}else{d.style.background='rgba(255,255,255,0.1)';d.textContent='🔈';t.textContent='Earpiece';}}
async function startCall(v){if(!currentUser){alert('Age select koro Sohel/Mou'); return;}otherUser=currentUser==='Sohel'?'Mou':'Sohel';document.getElementById('callScreen').classList.remove('hidden');document.getElementById('callName').textContent=otherUser;document.getElementById('callTimer').textContent='Calling...';showControls();document.getElementById('callTone').play().catch(()=>{});try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:!!v});}catch{alert('Camera allow');return;}document.getElementById('localVideo').srcObject=localStream;document.getElementById('localVideo').classList.remove('hidden');document.getElementById('localVideo').style.right='16px';document.getElementById('localVideo').style.bottom='16px';document.getElementById('localVideo').style.left='auto';document.getElementById('localVideo').style.top='auto';setSpeaker(false);const p1=createPC();localStream.getTracks().forEach(t=>p1.addTrack(t,localStream));const off=await p1.createOffer();await p1.setLocalDescription(off);await fb.set(callRef,{offer:{type:off.type,sdp:off.sdp},caller:currentUser,callee:otherUser,type:v?'video':'voice',state:'calling'});listenCandidates(otherUser);}
async function acceptCall(d){stopAllSounds();document.getElementById('incomingBox').classList.add('hidden');document.getElementById('callScreen').classList.remove('hidden');document.getElementById('callName').textContent=d.caller;showControls();try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:d.type==='video'});}catch{return;}document.getElementById('localVideo').srcObject=localStream;document.getElementById('localVideo').classList.toggle('hidden',d.type!=='video');setSpeaker(false);const p2=createPC();localStream.getTracks().forEach(t=>p2.addTrack(t,localStream));await p2.setRemoteDescription(new RTCSessionDescription(d.offer));const ans=await p2.createAnswer();await p2.setLocalDescription(ans);await fb.set(fb.ref(db,'sm_calls/current/answer'),{type:ans.type,sdp:ans.sdp});await fb.set(fb.ref(db,'sm_calls/current/state'),'connected');listenCandidates(d.caller);startTimer();}
function endCall(){stopAllSounds();fb.remove(fb.ref(db,'sm_calls/candidates/'+currentUser));fb.remove(fb.ref(db,'sm_calls/candidates/'+otherUser));if(pc)pc.close();pc=null;if(localStream)localStream.getTracks().forEach(t=>t.stop());clearInterval(timerInt);if(controlsHideTimer) clearTimeout(controlsHideTimer);document.getElementById('callScreen').classList.add('hidden');document.getElementById('remoteVideo').srcObject=null;document.getElementById('remoteVideo').classList.add('hidden');document.getElementById('remoteAudio').srcObject=null;fb.remove(callRef);}
fb.onValue(callRef,async s=>{const d=s.val(); if(!d||!currentUser) return; if(d.state==='calling'&&d.callee===currentUser){document.getElementById('incomingText').textContent=d.caller+' calling...';document.getElementById('incomingBox').classList.remove('hidden');window._in=d;document.getElementById('ringTone').play().catch(()=>{});} if(d.answer&&d.caller===currentUser&&pc){stopAllSounds();try{await pc.setRemoteDescription(new RTCSessionDescription(d.answer));}catch{}startTimer();showControls();} if(!d){stopAllSounds();}});
const localVideo=document.getElementById('localVideo'); const callVideoArea=document.getElementById('callVideoArea');
let isDragging=false, startX, startY, initLeft, initTop;
function getPos(e){return e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY};}
function startDrag(e){if(localVideo.classList.contains('hidden')) return; isDragging=true; localVideo.classList.add('dragging'); const p=getPos(e); const r=localVideo.getBoundingClientRect(); const pr=callVideoArea.getBoundingClientRect(); startX=p.x; startY=p.y; initLeft=r.left-pr.left; initTop=r.top-pr.top; e.preventDefault();}
function onDrag(e){if(!isDragging) return; const p=getPos(e); let nl=initLeft+(p.x-startX); let nt=initTop+(p.y-startY); const pr=callVideoArea.getBoundingClientRect(); const vr=localVideo.getBoundingClientRect(); nl=Math.max(0,Math.min(nl,pr.width-vr.width-8)); nt=Math.max(0,Math.min(nt,pr.height-vr.height-8)); localVideo.style.left=nl+'px'; localVideo.style.top=nt+'px'; localVideo.style.right='auto'; localVideo.style.bottom='auto'; e.preventDefault();}
function endDrag(){isDragging=false; localVideo.classList.remove('dragging');}
localVideo.addEventListener('mousedown',startDrag); localVideo.addEventListener('touchstart',startDrag,{passive:false});
window.addEventListener('mousemove',onDrag); window.addEventListener('touchmove',onDrag,{passive:false});
window.addEventListener('mouseup',endDrag); window.addEventListener('touchend',endDrag);
document.getElementById('callVideoArea').addEventListener('click',e=>{ if(e.target===localVideo) return; if(!isDragging) showControls(); });
document.getElementById('voiceBtn').addEventListener('click',()=>startCall(false));
document.getElementById('videoBtn').addEventListener('click',()=>startCall(true));
document.getElementById('acceptBtn').addEventListener('click',()=>{if(window._in)acceptCall(window._in);});
document.getElementById('declineBtn').addEventListener('click',()=>{stopAllSounds();fb.remove(callRef);document.getElementById('incomingBox').classList.add('hidden');});
document.getElementById('endBtn').addEventListener('click',endCall);
document.getElementById('floatingEndBtn').addEventListener('click',endCall);
document.getElementById('callBackBtn').addEventListener('click',endCall);
document.getElementById('muteBtn').addEventListener('click',()=>{if(localStream)localStream.getAudioTracks().forEach(t=>t.enabled=!t.enabled);});
document.getElementById('speakerBtn').addEventListener('click',async()=>{await setSpeaker(!speakerOn);});
document.addEventListener('click',e=>{ if(!e.target.closest('#contextMenu')) document.getElementById('contextMenu').classList.add('hidden'); });
</script>
</body>
</html>
