<script type="module">

import { getDatabase, ref, push, onChildAdded, onValue, set, remove, update, onDisconnect, query, orderByChild, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyD-2OqkcSev3XzcAt4-p2kGLkGYYqL8hzE",authDomain:"sm-chat-da9f7.firebaseapp.com",projectId:"sm-chat-da9f7",databaseURL:"https://sm-chat-da9f7-default-rtdb.asia-southeast1.firebasedatabase.app"};
const app=initializeApp(firebaseConfig);const db=getDatabase(app);window.fb={ref,push,onChildAdded,onValue,set,remove,update,onDisconnect,query,orderByChild,serverTimestamp};window.db=db;

<script type="module">
const messagesRef=fb.ref(db,"smMessenger/messages/SM_ROOM");const presenceRef=fb.ref(db,"smMessenger/presence");const callRef=fb.ref(db,"sm_calls/current");
let currentUser='',otherUser='',pc,localStream,timerInt;let presenceData={};let pendingImage=null,pendingVideo=null,pendingFile=null,pendingAudio=null;let selectedKey=null,selectedIsMe=false;let candListeners=[];

function timeAgo(ts){if(!ts) return 'Offline';const d=Date.now()-ts;const m=Math.floor(d/60000);if(m<1) return 'Active now';if(m<60) return `Active ${m}m ago`;const h=Math.floor(m/60);if(h<24) return `Active ${h}h ago`;return `Active ${Math.floor(h/24)}d ago`;}

function setUser(n){
 currentUser=n; otherUser=n==='Sohel'?'Mou':'Sohel';
 localStorage.setItem('sm_user',n);
 document.getElementById('whoami').textContent=n;
 document.getElementById('headerName').textContent=otherUser+' ❤️';
 document.getElementById('nameBox').style.display='none';
 const myRef=fb.ref(db,'smMessenger/presence/'+n);
 fb.set(myRef,{online:true,lastSeen:fb.serverTimestamp()});
 fb.onDisconnect(myRef).update({online:false,lastSeen:fb.serverTimestamp()});
}
let cu=localStorage.getItem('sm_user')||'';if(cu)setUser(cu);window.setUser=setUser;
if(localStorage.getItem('sm_unlocked')==='yes')document.getElementById('lockScreen').style.display='none';

fb.onValue(presenceRef,s=>{
 presenceData=s.val()||{}; const o=presenceData[otherUser];
 const el=document.getElementById('statusText');
 if(o&&o.online){el.textContent='● Active now';el.className='text-[11px] text-green-400';}
 else if(o&&o.lastSeen){el.textContent='● '+timeAgo(o.lastSeen);el.className='text-[11px] text-white/50';}
 else{el.textContent='● Offline';}
});
setInterval(()=>{const o=presenceData[otherUser];if(o&&!o.online&&o.lastSeen){document.getElementById('statusText').textContent='● '+timeAgo(o.lastSeen);}},60000);

// TYPING
fb.onValue(fb.ref(db,'smMessenger/typing/SM_ROOM/'+otherUser),snap=>{
 document.getElementById('typingLine').classList.toggle('hidden',!snap.val());
});

const messagesEl=document.getElementById('messages');
function tick(read){return read?'<span style="color:#53bdeb">✓✓ Seen</span>':'✓✓ Delivered';}

function render(child){
 const d=child.val(); if(!d) return null;
 if(localStorage.getItem('deleted_me_'+child.key)) return null;
 const isMe=d.sender===currentUser;
 const div=document.createElement('div'); div.className=`flex ${isMe?'justify-end':'justify-start'}`; div.id='msg-'+child.key;
 let c='';
 if(d.deleted){ c=`<div class="italic opacity-60 text-[13px]">🚫 ${d.deletedBy} unsent a message</div>`; }
 else if(d.type==='image') c=`<img src="${d.data}" class="rounded-xl max-w-[230px]">`;
 else if(d.type==='video') c=`<video controls playsinline src="${d.data}" class="rounded-xl max-w-[240px] max-h-[300px] bg-black"></video>`;
 else if(d.type==='file') c=`<a href="${d.data}" download="${d.fileName}" class="underline break-all">📎 ${d.fileName}</a>`;
 else if(d.type==='audio') c=`<div class="voice-box"><button class="aplay w-9 h-9 bg-white/20 rounded-full flex items-center justify-center" data-key="${child.key}">▶️</button><div class="wave"><i></i><i style="height:16px"></i><i style="height:20px"></i><i style="height:12px"></i></div><span class="text-xs opacity-70">Voice</span><audio id="aud-${child.key}" src="${d.data}"></audio></div>`;
 else c=`<div class="whitespace-pre-wrap break-words">${d.text||''}</div>`;
 div.innerHTML=`<div class="${isMe?'msg-me':'msg-other'} ${d.deleted?'!bg-transparent border border-white/20':''} px-4 py-2.5 max-w-[80%] text-white text-[14px]">${c}<div class="text-[9px] opacity-60 mt-1 flex justify-between gap-3"><span>${d.time||''}</span><span>${d.deleted?'':isMe?tick(d.readByOther):d.sender}</span></div></div>`;

 const show=(e)=>{
  selectedKey=child.key; selectedIsMe=isMe;
  const m=document.getElementById('contextMenu');
  if(d.deleted){ m.innerHTML=`<button onclick="menuAction('me')" class="w-full text-left px-4 py-3 text-[13px]">🗑️ Delete for me</button>`; }
  else if(isMe){ m.innerHTML=`<button onclick="menuAction('everyone')" class="w-full text-left px-4 py-3 text-[13px]">🚫 Unsend for Everyone</button><button onclick="menuAction('me')" class="w-full text-left px-4 py-3 text-[13px]">🗑️ Delete for me only</button>`; }
  else { m.innerHTML=`<button onclick="menuAction('me')" class="w-full text-left px-4 py-3 text-[13px]">🗑️ Delete for me only</button>`; }
  m.style.left=(e.pageX||30)+'px'; m.style.top=(e.pageY||80)+'px'; m.classList.remove('hidden');
 };
 div.oncontextmenu=e=>{e.preventDefault();show(e);}; let t; div.addEventListener('touchstart',e=>{t=setTimeout(()=>show(e.touches[0]),600);}); div.addEventListener('touchend',()=>clearTimeout(t));
 div.querySelectorAll('.aplay').forEach(b=>{
  b.onclick=()=>{ const aud=document.getElementById('aud-'+b.dataset.key); if(aud.paused){document.querySelectorAll('audio').forEach(x=>{if(x.id!==aud.id) x.pause();}); aud.play(); b.textContent='⏸️';} else{aud.pause(); b.textContent='▶️';} aud.onended=()=>b.textContent='▶️'; };
 });
 return div;
}

fb.onValue(messagesRef,snap=>{
 messagesEl.innerHTML='';
 snap.forEach(child=>{
  const el=render(child); if(el) messagesEl.appendChild(el);
  const d=child.val();
  if(d.sender!==currentUser && !d.readByOther && !d.deleted){
   fb.update(fb.ref(db,'smMessenger/messages/SM_ROOM/'+child.key),{readByOther:true});
   document.getElementById('msgTone').play().catch(()=>{});
  }
 });
 messagesEl.scrollTop=messagesEl.scrollHeight;
});

window.menuAction=async type=>{
 document.getElementById('contextMenu').classList.add('hidden'); if(!selectedKey) return;
 if(type==='me'){ localStorage.setItem('deleted_me_'+selectedKey,'1'); const el=document.getElementById('msg-'+selectedKey); if(el) el.remove(); }
 if(type==='everyone'){ if(!selectedIsMe) return; await fb.update(fb.ref(db,'smMessenger/messages/SM_ROOM/'+selectedKey),{deleted:true,deletedBy:currentUser}); }
};

async function sendMessage(extra={}){
 let text=document.getElementById('msgInput').value.trim();
 if(!text && !extra.data && !pendingImage && !pendingVideo && !pendingFile && !pendingAudio) return;
 if(!currentUser){alert('Select user'); return;}
 let obj={sender:currentUser,text,createdAt:fb.serverTimestamp(),time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),type:'text',readByOther:false,...extra};
 if(pendingImage){obj={...obj,data:pendingImage,type:'image'};}
 if(pendingVideo){obj={...obj,data:pendingVideo,type:'video'};}
 if(pendingFile){obj={...obj,data:pendingFile.data,type:'file',fileName:pendingFile.name};}
 if(pendingAudio){obj={...obj,data:pendingAudio,type:'audio'};}
 document.getElementById('msgInput').value=''; cancelPreview();
 fb.set(fb.ref(db,'smMessenger/typing/SM_ROOM/'+currentUser),false);
 await fb.push(messagesRef,obj);
}
document.getElementById('sendBtn').onclick=()=>sendMessage();
document.getElementById('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});
document.getElementById('msgInput').addEventListener('input',e=>{e.target.style.height='auto'; e.target.style.height=Math.min(e.target.scrollHeight,100)+'px'; fb.set(fb.ref(db,'smMessenger/typing/SM_ROOM/'+currentUser),true); setTimeout(()=>fb.set(fb.ref(db,'smMessenger/typing/SM_ROOM/'+currentUser),false),2000);});

window.cancelPreview=()=>{pendingImage=null;pendingVideo=null;pendingFile=null;pendingAudio=null;document.getElementById('previewBox').classList.add('hidden');};
async function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});}
document.getElementById('imgInput').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;let data=await fileToDataURL(f);
 if(f.type.startsWith('image/')){
  const img=new Image(); img.src=data; await new Promise(r=>img.onload=r);
  const c=document.createElement('canvas');let w=img.width,h=img.height;const max=800;if(w>max||h>max){if(w>h){h*=max/w;w=max;}else{w*=max/h;h=max;}}
  c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);data=c.toDataURL('image/jpeg',0.55);
  pendingImage=data;document.getElementById('previewText').textContent='📷 Photo ready';document.getElementById('previewBox').classList.remove('hidden');
 }else if(f.type.startsWith('video/')){
  if(data.length>2.2*1024*1024){alert('Video ta 2MB er niche pathao');return;}
  pendingVideo=data;document.getElementById('previewText').textContent='🎬 Video ready';document.getElementById('previewBox').classList.remove('hidden');
 }
 e.target.value='';
};
document.getElementById('fileInput').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;const data=await fileToDataURL(f);
 if(data.length>2.2*1024*1024){alert('File boro, 2MB er niche');return;}
 pendingFile={data,name:f.name};document.getElementById('previewText').textContent='📎 '+f.name;document.getElementById('previewBox').classList.remove('hidden');e.target.value='';
};
let mr,ac=[];document.getElementById('micBtn').onclick=async()=>{
 const b=document.getElementById('micBtn');
 if(mr&&mr.state==='recording'){mr.stop();b.textContent='🎙️';b.classList.remove('bg-red-600');return;}
 try{const s=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(s);ac=[];mr.ondataavailable=e=>ac.push(e.data);mr.onstop=()=>{const bl=new Blob(ac,{type:'audio/webm'});const r=new FileReader();r.onload=()=>{pendingAudio=r.result;document.getElementById('previewText').textContent='🎤 Voice ready';document.getElementById('previewBox').classList.remove('hidden');};r.readAsDataURL(bl);s.getTracks().forEach(t=>t.stop());};mr.start();b.textContent='⏹️';b.classList.add('bg-red-600');document.getElementById('previewText').textContent='🔴 Recording...';document.getElementById('previewBox').classList.remove('hidden');}catch{alert('Mic allow koro');}
};

// --- CALL FIXED WITH CANDIDATE LISTENER ---
function createPC(){
 pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});
 pc.onicecandidate=e=>{
  if(e.candidate){
   fb.push(fb.ref(db,'sm_calls/candidates/'+currentUser),e.candidate.toJSON());
  }
 };
 pc.ontrack=e=>{
  console.log('Remote track received');
  const rv=document.getElementById('remoteVideo');
  if(rv.srcObject!==e.streams[0]){
   rv.srcObject=e.streams[0];
   rv.play().catch(()=>{});
  }
 };
 return pc;
}
function listenCandidates(other){
 candListeners.forEach(off=>{try{off();}catch{}});
 candListeners=[];
 const refOther=fb.ref(db,'sm_calls/candidates/'+other);
 const off=fb.onValue(refOther,snap=>{
  snap.forEach(child=>{
   const c=child.val();
   if(c && pc){
    pc.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{});
   }
  });
 });
 candListeners.push(off);
}
function startTimer(){let s=0;timerInt=setInterval(()=>{s++;const m=String(Math.floor(s/60)).padStart(2,'0');const sec=String(s%60).padStart(2,'0');document.getElementById('callTimer').textContent=m+':'+sec;},1000);}
async function startCall(v){
 if(!currentUser){alert('Select user');return;}
 otherUser=currentUser==='Sohel'?'Mou':'Sohel';
 document.getElementById('callScreen').classList.remove('hidden');
 document.getElementById('callName').textContent='Calling '+otherUser+'...';
 document.getElementById('callTone').play().catch(()=>{});
 try{ localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:!!v}); }catch{alert('Camera/Mic allow koro'); return;}
 document.getElementById('localVideo').srcObject=localStream;
 document.getElementById('localVideo').style.display=v?'block':'none';
 const p1=createPC();
 localStream.getTracks().forEach(t=>p1.addTrack(t,localStream));
 const off=await p1.createOffer(); await p1.setLocalDescription(off);
 await fb.set(callRef,{offer:{type:off.type,sdp:off.sdp},caller:currentUser,callee:otherUser,type:v?'video':'voice',state:'calling'});
 listenCandidates(otherUser);
}
async function acceptCall(d){
 document.getElementById('incomingBox').classList.add('hidden');
 document.getElementById('callScreen').classList.remove('hidden');
 document.getElementById('callName').textContent='Connected with '+d.caller;
 document.getElementById('ringTone').pause(); document.getElementById('callTone').pause();
 try{ localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:d.type==='video'}); }catch{alert('Camera/Mic allow'); return;}
 document.getElementById('localVideo').srcObject=localStream;
 document.getElementById('localVideo').style.display=d.type==='video'?'block':'none';
 const p2=createPC();
 localStream.getTracks().forEach(t=>p2.addTrack(t,localStream));
 await p2.setRemoteDescription(new RTCSessionDescription(d.offer));
 const ans=await p2.createAnswer(); await p2.setLocalDescription(ans);
 await fb.set(fb.ref(db,'sm_calls/current/answer'),{type:ans.type,sdp:ans.sdp});
 await fb.set(fb.ref(db,'sm_calls/current/state'),'connected');
 listenCandidates(d.caller);
 startTimer();
}
function endCall(){
 candListeners.forEach(off=>{try{off();}catch{}}); candListeners=[];
 fb.remove(fb.ref(db,'sm_calls/candidates/'+currentUser));
 fb.remove(fb.ref(db,'sm_calls/candidates/'+otherUser));
 if(pc)pc.close(); pc=null;
 if(localStream)localStream.getTracks().forEach(t=>t.stop());
 clearInterval(timerInt);
 document.getElementById('ringTone').pause(); document.getElementById('callTone').pause();
 document.getElementById('callScreen').classList.add('hidden');
 document.getElementById('remoteVideo').srcObject=null;
 fb.remove(callRef);
}
fb.onValue(callRef,async s=>{
 const d=s.val(); if(!d||!currentUser) return;
 if(d.state==='calling'&&d.callee===currentUser){
  document.getElementById('incomingText').textContent=d.caller+' is '+d.type+' calling...';
  document.getElementById('incomingBox').classList.remove('hidden');
  window._in=d;
  document.getElementById('ringTone').play().catch(()=>{});
  if(navigator.vibrate) navigator.vibrate([400,200,800]);
 }
 if(d.answer&&d.caller===currentUser&&pc){
  try{ await pc.setRemoteDescription(new RTCSessionDescription(d.answer)); }catch{}
  document.getElementById('callName').textContent='Connected with '+d.callee;
  document.getElementById('callTone').pause(); document.getElementById('ringTone').pause();
  startTimer();
 }
});
document.getElementById('voiceBtn').onclick=()=>startCall(false);
document.getElementById('videoBtn').onclick=()=>startCall(true);
document.getElementById('acceptBtn').onclick=()=>{if(window._in)acceptCall(window._in);};
document.getElementById('declineBtn').onclick=()=>{document.getElementById('ringTone').pause();document.getElementById('callTone').pause();fb.remove(callRef);document.getElementById('incomingBox').classList.add('hidden');};
document.getElementById('endBtn').onclick=endCall;
document.getElementById('muteBtn').onclick=e=>{if(localStream)localStream.getAudioTracks().forEach(t=>t.enabled=!t.enabled);e.currentTarget.textContent=e.currentTarget.textContent==='🎤'?'🔇':'🎤';};
document.getElementById('whoami').onclick=()=>{localStorage.removeItem('sm_user');location.reload();};
document.addEventListener('click',()=>document.getElementById('contextMenu').classList.add('hidden'));
</script>
</body>
